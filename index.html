function init3d(){if(!window.THREE){$('#fallback').textContent='3D engine did not load. Please check your internet connection; menus remain available.';return}scene=new THREE.Scene();scene.background=new THREE.Color('#4a315a');scene.fog=new THREE.Fog('#4a315a',13,28);camera=new THREE.PerspectiveCamera(45,1,.1,100);camera.position.set(0,3.2,7.8);camera.lookAt(0,1,0);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));$('#scene').appendChild(renderer.domElement);$('#fallback').classList.add('hidden');scene.add(new THREE.HemisphereLight('#ffe5ff','#58416b',2));let l=new THREE.DirectionalLight('#fff0df',2);l.position.set(-4,8,5);scene.add(l);world=new THREE.Group();scene.add(world);cube(18,.2,16,'#7c6682',0,-.12,0);cube(18,5,.25,'#6a5277',0,2.35,-5.2);for(let i=-7;i<=7;i+=2.3){cube(1.9,2.1,.08,'#d8b6cc',i,2.25,-5.04);cube(1.75,1.95,.04,'#f2cce0',i,2.25,-4.98)}cube(3.4,2.5,.08,'#c6a8d5',-4,1.7,-4.85);for(let x of [-7,7]){cube(.65,1,.55,'#241c2d',x,2.8,-4.2);ball(.2,'#9a85a9',x,2.8,-3.9)}avatar=character(g.player,0,.8,1);npcs=[character({skin:'#d7a5a0',hair:'#271a2b',eyes:'#33262c',makeup:'#a35d86',outfit:'#6d4a89'},-2.5,.1,.9),character({skin:'#c58c72',hair:'#503b28',eyes:'#241e20',makeup:'#a35d86',outfit:'#6c5a9a'},2.5,-.4,.95),character({skin:'#efc8ad',hair:'#17141d',eyes:'#29202b',makeup:'#a35d86',outfit:'#8b5aa2'},-4,-1,.88),character({skin:'#d8a88f',hair:'#9a655b',eyes:'#392323',makeup:'#a35d86',outfit:'#a45b86'},4,-1,.88)];function resize(){let w=$('#scene').clientWidth,h=$('#scene').clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe($('#scene'));resize();let clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);let d=Math.min(clock.getDelta(),.04);if(avatar){let s=d*2.2;avatar.position.x=Math.max(-7,Math.min(7,avatar.position.x+((keys.ArrowRight||keys.d)?s:0)-((keys.ArrowLeft||keys.a)?s:0)));avatar.position.z=Math.max(-2,Math.min(4,avatar.position.z+((keys.ArrowDown||keys.s)?s:0)-((keys.ArrowUp||keys.w)?s:0)))}npcs.forEach((n,i)=>n.position.y=Math.sin(clock.elapsedTime+i)*.025);renderer.render(scene,camera)}loop();window.addEventListener('keydown',e=>keys[e.key]=true);window.addEventListener('keyup',e=>keys[e.key]=false)}

function panelHTML(n){
if(n==='creator')return head('✧ Character Studio')+'<div class="avatarpreview">'+g.player.face+'</div><p class="muted">Customize Mirae. Her 3D model updates when you save.</p><div class="grid"><label class="field">Legal name<input id="cName" value="'+esc(g.player.name)+'"></label><label class="field">Stage name<input id="cStage" value="'+esc(g.player.stage)+'"></label><label class="field">Face ID<select id="cFace">'+['👩🏻‍🎤','👩🏼‍🎤','👩🏽‍🎤','👩🏾‍🎤','👩🏿‍🎤','👨🏻‍🎤','👨🏽‍🎤','🧑🏻‍🎤'].map(x=>'<option '+(x===g.player.face?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label class="field">Skin tone<input id="cSkin" type="color" value="'+g.player.skin+'"></label><label class="field">Hair color<input id="cHair" type="color" value="'+g.player.hair+'"></label><label class="field">Eye color<input id="cEyes" type="color" value="'+g.player.eyes+'"></label><label class="field">Outfit<input id="cOutfit" type="color" value="'+g.player.outfit+'"></label><label class="field">Makeup<input id="cMakeup" type="color" value="'+g.player.makeup+'"></label><label class="field">Height<input id="cHeight" type="range" min="150" max="185" value="'+g.player.height+'"></label></div><label class="field">Bio<textarea id="cBio">'+esc(g.player.bio)+'</textarea></label><button class="primary" data-save-look>Save appearance</button> <button data-random>Random look</button>';

return head('Phone')}

function npcPost(){let p=pick([['CHERRYBOMB','@cherrybomb_official','Practice room until midnight again. We have something special coming.'],['VEIL7','@veil7_official','Seoul, you were incredible tonight. We love you.'],['SERAPH','@seraph_official','New music is closer than you think.'],['IDOLWIRE NEWS','@idolwire_news','Industry watch: ECLIPSE is preparing a new rookie project.'],['Yuna','@yuna_muse','Rookie artists, remember to take care of yourselves.'],['Fan account','@eclipseupdates','Who will be the next breakout rookie?']]);g.posts.unshift({id:Math.random().toString(36),by:p[0],handle:p[1],text:p[2],time:'just now',likes:rand(12,2400)});g.posts=g.posts.slice(0,50);save()}
function panelClick(e){let b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-close'))closePanel();else if(b.dataset.open)openPanel(b.dataset.open);else if(b.hasAttribute('data-save-look')){g.player.name=$('#cName').value;g.player.stage=$('#cStage').value;g.player.face=$('#cFace').value;['skin','hair','eyes','outfit','makeup'].forEach(k=>g.player[k]=$('#c'+k[0].toUpperCase()+k.slice(1)).value);g.player.height=Number($('#cHeight').value);g.player.bio=$('#cBio').value;if(avatar){let pos=avatar.position.clone();world.remove(avatar);avatar=character(g.player,pos.x,pos.z,1)}save();toast('Mirae’s new look has been saved.');openPanel('creator')}else if(b.hasAttribute('data-random')){g.player.hair=pick(['#17131f','#593a32','#d1a35b','#bb739d','#376c89']);g.player.outfit=pick(['#27233a','#b74d83','#4b6f9b','#eee0ed','#242424']);save();openPanel('creator')}else if(b.hasAttribute('data-post')){let t=$('#compose').value.trim();if(t){g.posts.unshift({id:Math.random().toString(36),by:g.player.stage,handle:'@'+g.player.stage.toLowerCase(),text:t,time:'just now',likes:0});g.points+=2;save();openPanel('social');toast('Mirae posted on IDOLWIRE.')}}else if(b.dataset.talk!==undefined){let p=people[Number(b.dataset.talk)];g.relationships[p.name]=clamp(g.relationships[p.name]+4);say(p.name,p.line);save();openPanel('people')}else if(b.dataset.task){g.stats[b.dataset.task]=clamp(g.stats[b.dataset.task]+Number(b.dataset.gain));g.stats.stamina=clamp(g.stats.stamina+Number(b.dataset.energy));save();toast('Activity completed.');openPanel('schedule')}else if(b.hasAttribute('data-next-day')){g.day++;g.week=Math.ceil(g.day/7);g.cash-=2000000;npcPost();refresh();save();toast('A new day begins.');openPanel('schedule')}else if(b.dataset.room){g.room=b.dataset.room;$('#loc').textContent='⌖ ECLIPSE · '+g.room;closePanel();say(g.player.stage,'You arrived at the '+g.room+'. What should we do here?');if(avatar)avatar.position.set(rand(-2,2),0,rand(0,2))}else if(b.dataset.like){let p=g.posts.find(x=>x.id===b.dataset.like);if(p)p.likes++;save();openPanel('social')}else if(b.dataset.reply){let p=g.posts.find(x=>x.id===b.dataset.reply),t=prompt('Reply to '+p.by);if(t){g.posts.unshift({id:Math.random().toString(36),by:g.player.stage,handle:'@'+g.player.stage.toLowerCase(),text:'↳ '+t,time:'just now',likes:0});save();openPanel('social')}}else if(b.hasAttribute('data-export')){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(g)],{type:'application/json'}));a.href=u;a.download='IDOLVERSE-save.json';a.click();URL.revokeObjectURL(u)}}
