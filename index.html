<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDOLVERSE</title><style>
*{box-sizing:border-box}body{margin:0;background:#110d18;color:#fff;font:15px system-ui}header{padding:22px;background:linear-gradient(120deg,#39214d,#8e3975)}h1{margin:0;font-size:30px}main{max-width:950px;margin:auto;padding:16px}.tabs,.row{display:flex;gap:8px;flex-wrap:wrap}button,input,select,textarea{background:#241a30;color:white;border:1px solid #60456e;border-radius:9px;padding:10px;font:inherit}button{cursor:pointer}button.active,.primary{background:#a64f91;border:0}.panel,.card{background:#21182b;border:1px solid #4b3656;border-radius:14px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.muted{color:#c7b5d0}label{display:block;margin:10px 0 4px}textarea{width:100%;min-height:80px}.stat{background:#17111f;padding:12px;border-radius:10px;flex:1;min-width:120px}.stat b{display:block;font-size:22px}.post{border-bottom:1px solid #4b3656;padding:10px 0}
</style></head><body><header><h1>IDOL<span style="color:#ff9bd2">VERSE</span></h1><div>THE K-POP INDUSTRY IS YOURS · 2026</div></header><main><div class="tabs" id="tabs"></div><div id="app"></div><p class="muted">Your progress autosaves in this browser. Export your save before changing devices.</p></main><script>
const $=x=>document.querySelector(x),names=['Kim Seoyeon','Park Yejin','Lee Sumin','Choi Minji','Kang Nari','Jung Chaewon','Han Yuna','Yoon Seulgi','Oh Jiwon','Shin Haeun','Baek Sohee','Kwon Ara','Lim Daeun','Moon Jisoo','Song Hyerin','Mori Airi','Chen Xinyi'],traits=['Ambitious','Reserved','Bubbly','Competitive','Perfectionist','Independent','Sensitive','Charismatic'],stories=['Former trainee at a major agency.','Classically trained vocalist discovered at a competition.','Dance academy standout with a growing social following.','Survival-show contestant who narrowly missed debut.','Self-taught rapper who uploaded music anonymously.','Viral dance-cover creator.'];
let state=JSON.parse(localStorage.getItem('ivsave')||'null')||{week:1,cash:850000000,rep:32,pop:12,group:'',concept:'Elegant',fandom:'',members:[],candidates:[],posts:[{by:'IDOLWIRE NEWS',text:'The 2026 rookie race is heating up. Which agency will surprise everyone?'}],log:['Han Mirae has joined ECLIPSE Entertainment. The E-01 girl group project is underway.']},tab='Dashboard';
function save(){localStorage.setItem('ivsave',JSON.stringify(state))}
function go(t){tab=t;draw()}
function candidate(){return{id:Math.random().toString(36).slice(2),name:names[Math.floor(Math.random()*names.length)],age:17+Math.floor(Math.random()*8),trait:traits[Math.floor(Math.random()*traits.length)],story:stories[Math.floor(Math.random()*stories.length)],vocal:40+Math.floor(Math.random()*60),dance:40+Math.floor(Math.random()*60),rap:30+Math.floor(Math.random()*70),visual:45+Math.floor(Math.random()*55),stage:35+Math.floor(Math.random()*65),fee:(3+Math.floor(Math.random()*10))*1000000}}
function profile(m){return '<article class="card"><b>'+m.name+'</b> · '+m.age+' · '+m.trait+'<p class="muted">'+m.story+'</p><p>Vocal '+m.vocal+' · Dance '+m.dance+' · Rap '+m.rap+' · Visual '+m.visual+' · Stage '+m.stage+'</p><button onclick="sign(\''+m.id+'\')">Sign · ₩'+m.fee/1000000+'M</button></article>'}
function draw(){let pages=['Dashboard','Group','Auditions','IDOLWIRE','Industry','Company','Save Manager'];$('#tabs').innerHTML=pages.map(x=>'<button class="'+(x===tab?'active':'')+'" onclick="go(\''+x+'\')">'+x+'</button>').join('');let a=$('#app');
if(tab==='Dashboard')a.innerHTML='<section class="panel"><small>ECLIPSE ENTERTAINMENT · SEOUL</small><h2>Build your place in the industry.</h2><p>Manage your debut project, develop artists, and survive the competition.</p><b>Project E-01 · Han Mirae · 20 · South Korean</b></section><div class="row">'+[['Cash','₩'+(state.cash/1e6).toFixed(0)+'M'],['Reputation',state.rep],['Popularity',state.pop],['Members',state.members.length+'/7']].map(x=>'<div class="stat">'+x[0]+'<b>'+x[1]+'</b></div>').join('')+'</div><section class="panel"><h3>Current priorities</h3><p>Recruit 3–7 members, define your group identity, and prepare your debut.</p><button class="primary" onclick="go(\'Auditions\')">Find trainees</button></section><section class="panel"><h3>Company briefing</h3><p>ECLIPSE is an independent agency known for viral marketing. Starting cash ₩850M; monthly expenses ₩60M.</p>'+state.log.map(x=>'<p class="muted">'+x+'</p>').join('')+'</section>';
if(tab==='Auditions')a.innerHTML='<section class="panel"><h2>Audition room</h2><p class="muted">Generate trainees with different skills, histories, and personalities.</p><button class="primary" onclick="for(let i=0;i<5;i++)state.candidates.push(candidate());save();draw()">Generate five candidates</button><div class="grid">'+state.candidates.map(profile).join('')+'</div></section>';
if(tab==='Group')a.innerHTML='<section class="panel"><h2>Group identity</h2><label>Group name</label><input id="gn" value="'+state.group+'" placeholder="Choose a group name"><label>Concept</label><select id="co">'+['Elegant','Girl crush','Fresh / youthful','Dark fantasy','R&B','Experimental','Retro'].map(x=>'<option '+(x===state.concept?'selected':'')+'>'+x+'</option>')+'</select><label>Fandom name</label><input id="fn" value="'+state.fandom+'" placeholder="Name your fandom"><button class="primary" onclick="state.group=$('#gn').value;state.concept=$('#co').value;state.fandom=$('#fn').value;save();draw()">Save identity</button><h3>Lineup · '+state.members.length+'/7</h3>'+state.members.map(profile).join('')+'</section>';
if(tab==='IDOLWIRE')a.innerHTML='<section class="panel"><h2>IDOLWIRE</h2><textarea id="msg" maxlength="280" placeholder="What's happening, Mirae?"></textarea><button class="primary" onclick="let t=$('#msg').value.trim();if(t){state.posts.unshift({by:'Han Mirae @hanmirae_official',text:t});state.rep=Math.min(100,state.rep+(/thank|love|grateful|excited|proud/i.test(t)?3:0));save();draw()}">Post</button></section><section class="panel">'+state.posts.map(p=>'<div class="post"><b>'+p.by+'</b><p>'+p.text+'</p></div>').join('')+'</section>';
if(tab==='Industry')a.innerHTML='<section class="panel"><h2>2026 agency landscape</h2><div class="grid">'+[['VANTA','Major label · global reach'],['AURELIS','Prestige · vocal development'],['BLACKLINE','Performance · hip-hop'],['LUMIÈRE','Luxury image · fashion'],['NOVA','Digital marketing · streaming'],['ORBIT','Experimental · electronic'],['HANEUL','Training · live performance'],['MUSE','Soloists · artistry'],['ECLIPSE','Independent · viral marketing'],['CROWN','New entrant · undisclosed plans']].map(x=>'<article class="card"><b>'+x[0]+'</b><p class="muted">'+x[1]+'</p></article>').join('')+'</div></section>';
if(tab==='Company')a.innerHTML='<section class="panel"><h2>ECLIPSE Entertainment</h2><p>Independent Seoul agency · viral marketing specialty</p><p>Cash: ₩'+(state.cash/1e6).toFixed(0)+'M · Reputation: '+state.rep+'/100</p><p>Staff: Kang Tae-jun (Operations), Seo Hye-jin (Artist Development), Lee Do-hyun (A&R), Choi Eun-seo (PR).</p><p>Existing act: CHERRYBOMB</p></section>';
if(tab==='Save Manager')a.innerHTML='<section class="panel"><h2>Save manager</h2><p>Autosaves in this browser. Export a backup to move your save.</p><button onclick="let u=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));let x=document.createElement('a');x.href=u;x.download='IDOLVERSE-save.json';x.click()">Export save</button><label>Import save</label><input type="file" id="file" accept=".json"><button onclick="let f=$('#file').files[0];if(f){let r=new FileReader();r.onload=()=>{state=JSON.parse(r.result);save();draw()};r.readAsText(f)}">Import save</button></section>';save()}
function sign(id){let m=state.candidates.find(x=>x.id===id);if(!m||state.members.length>=7)return alert('Lineup is full.');if(state.cash<m.fee)return alert('Insufficient funds.');state.cash-=m.fee;state.members.push(m);state.candidates=state.candidates.filter(x=>x.id!==id);state.log.unshift(m.name+' signed with ECLIPSE.');save();draw()}
draw();
</script></body></html>
