<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#110d18"><title>IDOLVERSE — K-pop Industry Simulator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#110d18;color:#fff;font:15px/1.5 system-ui}header{padding:22px 18px;background:linear-gradient(120deg,#39214d,#8e3975)}h1{margin:0;font-size:30px;letter-spacing:-1px}main{max-width:980px;margin:auto;padding:14px}.tabs,.row,.actions{display:flex;gap:8px;flex-wrap:wrap}button,input,select,textarea{background:#241a30;color:white;border:1px solid #60456e;border-radius:9px;padding:10px;font:inherit}button{cursor:pointer}button.active,.primary{background:#a64f91;border:0}.panel,.card{background:#21182b;border:1px solid #4b3656;border-radius:14px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.muted,small{color:#c7b5d0}label{display:block;margin:10px 0 4px}textarea{width:100%;min-height:85px}.stat{background:#17111f;padding:12px;border-radius:10px;flex:1;min-width:120px}.stat b{display:block;font-size:22px}.post{border-bottom:1px solid #4b3656;padding:10px 0}.meter{height:6px;background:#493b51;border-radius:8px;margin:4px 0 9px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#a87ce0,#ed78b9);border-radius:8px}.actions button{flex:1}.pill{font-size:11px;border:1px solid #60456e;border-radius:30px;padding:3px 8px}.face{width:48px;height:48px;display:inline-grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#59356e,#c45b9c);font-size:27px;flex:0 0 48px;border:2px solid #d78ac2}.person{display:flex;gap:10px;align-items:center}.face.big{width:88px;height:88px;font-size:48px;flex-basis:88px}.creator-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.creator-grid label{background:#17111f;border:1px solid #493653;border-radius:10px;padding:10px}.creator-grid input,.creator-grid select{width:100%}
</style></head><body><header><h1>IDOL<span style="color:#ff9bd2">VERSE</span></h1><div>THE K-POP INDUSTRY IS YOURS · 2026</div></header><main><nav class="tabs" id="tabs"></nav><div id="app"></div><div id="iv-diagnostic" role="status" style="margin:12px 0;padding:12px;border:1px solid #60456e;border-radius:10px;background:#21182b;color:#f7d7eb">IDOLVERSE is starting…</div><p class="muted">Progress autosaves in this browser. Export a save backup before changing devices.</p></main>
<script>
'use strict';
const diagnostic=document.getElementById('iv-diagnostic');
window.addEventListener('error',function(e){if(diagnostic)diagnostic.innerHTML='<b>Game startup error</b><br>'+String(e.message||'Unknown error')+'<br><small>Line: '+(e.lineno||'?')+'</small>';});
window.addEventListener('unhandledrejection',function(e){if(diagnostic)diagnostic.innerHTML='<b>Game startup error</b><br>'+String(e.reason||'Unknown promise error');});
const $=s=>document.querySelector(s);
const names=['Kim Seoyeon','Park Yejin','Lee Sumin','Choi Minji','Kang Nari','Jung Chaewon','Han Yuna','Yoon Seulgi','Oh Jiwon','Shin Haeun','Baek Sohee','Kwon Ara','Lim Daeun','Moon Jisoo','Song Hyerin','Mori Airi','Chen Xinyi'];
const traits=['Ambitious','Reserved','Bubbly','Competitive','Perfectionist','Independent','Sensitive','Charismatic'];
const stories=['Former trainee at a major agency; eliminated before debut.','Classically trained vocalist discovered at a competition.','Dance academy standout with a growing social following.','Survival-show contestant who narrowly missed debut.','Self-taught rapper who uploaded music anonymously.','Viral dance-cover creator with no formal training.','Studied music production and wants to write her own songs.'];
const agencies=[['VANTA','Major label · global reach'],['AURELIS','Prestige · vocal development'],['BLACKLINE','Performance · hip-hop'],['LUMIÈRE','Luxury image · fashion'],['NOVA','Digital marketing · streaming'],['ORBIT','Experimental · electronic'],['HANEUL','Training · live performance'],['MUSE','Soloists · artistry'],['ECLIPSE','Independent · viral marketing'],['CROWN','New entrant · undisclosed plans']];
let state;
try{state=JSON.parse(localStorage.getItem('idolverse_save_v2')||'null')}catch(e){state=null}
if(!state)state={week:1,month:10,year:2026,cash:850000000,rep:32,pop:12,fan:18,group:'',concept:'Elegant',fandom:'',members:[],candidates:[],posts:[{by:'IDOLWIRE NEWS',handle:'@idolwire_news',text:'The 2026 rookie race is heating up. Which agency will surprise everyone?'}],log:['Han Mirae has joined ECLIPSE Entertainment. The E-01 girl group project is underway.'],debut:false};
let page='Dashboard';
if(!state.player)state.player={name:'Han Mirae',stageName:'Mirae',age:20,nationality:'South Korean',pronouns:'She / her',face:'👩🏻‍🎤',hair:'Dark brown',eyes:'Brown',style:'Chic',bio:'An ambitious rookie hoping to build a new girl group.'};
state.members.forEach(m=>{if(!m.face)m.face='👩🏻‍🎤';if(!m.stageName)m.stageName=m.name.split(' ').slice(-1)[0]});state.candidates.forEach(m=>{if(!m.face)m.face='👩🏻‍🎤';if(!m.stageName)m.stageName=m.name.split(' ').slice(-1)[0]});
const pick=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,clamp=n=>Math.max(0,Math.min(100,n));
function save(){localStorage.setItem('idolverse_save_v2',JSON.stringify(state))}
function note(t){state.log.unshift(t);state.log=state.log.slice(0,12)}
function makeCandidate(){let name=pick(names);return{id:Math.random().toString(36).slice(2),name,stageName:name.split(' ').slice(-1)[0],face:pick(['👩🏻‍🎤','👩🏽‍🎤','👩🏾‍🎤','👩🏼‍🎤','👩🏻','👩🏽','👩🏾']),age:rand(17,24),trait:pick(traits),story:pick(stories),vocal:rand(40,99),dance:rand(40,99),rap:rand(25,98),visual:rand(45,99),stage:rand(35,98),fee:rand(3,12)*1000000}}
function go(p){page=p;draw()}
function meter(label,n){return '<small>'+label+' · '+n+'</small><div class="meter"><i style="width:'+n+'%"></i></div>'}
function candidateCard(m,canSign=true){return '<article class="card"><div class="person"><span class="face">'+(m.face||'👤')+'</span><div><b>'+escapeHTML(m.stageName||m.name)+'</b><br><small>'+escapeHTML(m.name)+'</small><br><span class="pill">'+m.age+' · '+m.trait+'</span></div></div><p class="muted">'+m.story+'</p>'+meter('Vocal',m.vocal)+meter('Dance',m.dance)+meter('Rap',m.rap)+meter('Visual',m.visual)+meter('Stage',m.stage)+'<div class="actions"><button data-profile="'+m.id+'">Profile</button>'+(canSign?'<button class="primary" data-sign="'+m.id+'">Sign · ₩'+(m.fee/1000000)+'M</button>':'')+'</div></article>'}
function draw(){
const pages=['Dashboard','Character Creator','Group','Auditions','IDOLWIRE','Industry','Company','Save Manager'];
$('#tabs').innerHTML=pages.map(p=>'<button class="'+(p===page?'active':'')+'" data-page="'+p+'">'+p+'</button>').join('');
let v=$('#app');
if(page==='Dashboard')v.innerHTML='<section class="panel"><small>ECLIPSE ENTERTAINMENT · SEOUL · OCTOBER 2026</small><h2>Build your place in the industry.</h2><p>Manage your debut project, develop artists, and survive the competition.</p><b>Project E-01 · Han Mirae · 20 · South Korean</b></section><div class="row">'+[['Cash','₩'+(state.cash/1e6).toFixed(0)+'M'],['Reputation',state.rep+'/100'],['Popularity',state.pop+'/100'],['Fan loyalty',state.fan+'/100'],['Members',state.members.length+'/7']].map(x=>'<div class="stat">'+x[0]+'<b>'+x[1]+'</b></div>').join('')+'</div><section class="panel"><h3>Current priorities</h3><p>Recruit 3–7 members, define your group&#39;s identity, then prepare your debut.</p><button class="primary" data-page="Auditions">Find trainees</button> <button data-next>Advance one week →</button></section><section class="panel"><h3>Company briefing</h3><p>ECLIPSE is an independent agency known for viral marketing. Starting cash ₩850M; monthly operating costs ₩60M.</p>'+state.log.map(x=>'<p class="muted">'+x+'</p>').join('')+'</section>';
if(page==='Character Creator')v.innerHTML='<section class="panel"><div class="person"><span class="face big">'+state.player.face+'</span><div><small>PLAYER CHARACTER · ECLIPSE ENTERTAINMENT</small><h2>'+escapeHTML(state.player.name)+'</h2><p class="muted">Customize Han Mirae and her visual identity.</p></div></div><div class="creator-grid"><label>Legal name<input id="pName" value="'+escapeAttr(state.player.name)+'"></label><label>Stage name<input id="pStage" value="'+escapeAttr(state.player.stageName)+'"></label><label>Age<input id="pAge" type="number" min="16" max="35" value="'+state.player.age+'"></label><label>Nationality<input id="pNation" value="'+escapeAttr(state.player.nationality)+'"></label><label>Pronouns<select id="pPronouns">'+['She / her','He / him','They / them'].map(x=>'<option '+(x===state.player.pronouns?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Face ID / avatar<select id="pFace">'+['👩🏻‍🎤','👩🏼‍🎤','👩🏽‍🎤','👩🏾‍🎤','👩🏿‍🎤','👩🏻','👩🏽','👩🏾','👩🏿','👨🏻‍🎤','👨🏽‍🎤','👨🏾‍🎤','🧑🏻‍🎤','🧑🏽‍🎤','🧑🏾‍🎤'].map(x=>'<option '+(x===state.player.face?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Hair color<select id="pHair">'+['Black','Dark brown','Chestnut','Blonde','Ash blonde','Silver','Pink','Blue','Red'].map(x=>'<option '+(x===state.player.hair?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Eye color<select id="pEyes">'+['Brown','Dark brown','Black','Hazel','Green','Blue','Gray'].map(x=>'<option '+(x===state.player.eyes?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Fashion style<select id="pStyle">'+['Chic','Streetwear','Elegant','Soft / feminine','Edgy','Sporty','Experimental'].map(x=>'<option '+(x===state.player.style?'selected':'')+'>'+x+'</option>').join('')+'</select></label></div><label>Character bio</label><textarea id="pBio">'+escapeHTML(state.player.bio)+'</textarea><button class="primary" data-save-player>Save character</button></section><section class="panel"><h3>Member Face IDs</h3><p class="muted">Every trainee and signed member gets a face icon beside their name.</p><div class="grid">'+state.members.map(m=>'<div class="card person"><span class="face">'+(m.face||'👤')+'</span><div><b>'+escapeHTML(m.stageName||m.name)+'</b><br><small>'+escapeHTML(m.name)+'</small></div></div>').join('')+'</div></section>';
if(page==='Auditions')v.innerHTML='<section class="panel"><h2>Audition room</h2><p class="muted">Generate candidates with varied skills, histories, and personalities.</p><button class="primary" data-generate>Generate five candidates</button><div class="grid">'+state.candidates.map(candidateCard).join('')+'</div></section>';
if(page==='Group')v.innerHTML='<section class="panel"><h2>Group identity</h2><label>Group name</label><input id="groupName" value="'+escapeAttr(state.group)+'" placeholder="Choose a group name"><label>Concept</label><select id="concept">'+['Elegant','Girl crush','Fresh / youthful','Dark fantasy','R&B','Experimental','Retro'].map(x=>'<option '+(x===state.concept?'selected':'')+'>'+x+'</option>').join('')+'</select><label>Fandom name</label><input id="fandom" value="'+escapeAttr(state.fandom)+'" placeholder="Name your fandom"><div class="actions"><button class="primary" data-save-group>Save identity</button><button data-debut>Start debut preparations</button></div><p class="muted">'+(state.debut?'Debut preparations are underway.':'Recruit at least three members to begin debut preparations.')+'</p></section><h3>Debut lineup · '+state.members.length+'/7</h3><div class="grid">'+state.members.map(m=>candidateCard(m,false)).join('')+'</div>';
if(page==='IDOLWIRE')v.innerHTML='<section class="panel"><h2>IDOLWIRE</h2><p class="muted">Your posts can build support—or create backlash.</p><textarea id="message" maxlength="280" placeholder="What is happening, Mirae?"></textarea><button class="primary" data-post>Post</button></section><section class="panel"><h3>Industry timeline</h3>'+state.posts.map(p=>'<div class="post"><b>'+p.by+'</b> <small>'+p.handle+'</small><p>'+escapeHTML(p.text)+'</p></div>').join('')+'</section>';
if(page==='Industry')v.innerHTML='<section class="panel"><h2>2026 agency landscape</h2><div class="grid">'+agencies.map(a=>'<article class="card"><b>'+a[0]+'</b><p class="muted">'+a[1]+'</p></article>').join('')+'</div><p class="muted">Established acts include VEIL7, SERAPH, ROGUE, ROSÉLLE, AFTERHOUR, SYNTHIA, BLUEPRINT, YUNA, and CHERRYBOMB.</p></section>';
if(page==='Company')v.innerHTML='<section class="panel"><h2>ECLIPSE Entertainment</h2><p>Independent Seoul agency · viral marketing specialty</p><div class="row"><div class="stat">Cash<b>₩'+(state.cash/1e6).toFixed(0)+'M</b></div><div class="stat">Reputation<b>'+state.rep+'/100</b></div></div><p>Staff: Kang Tae-jun (Operations), Seo Hye-jin (Artist Development), Lee Do-hyun (A&R), Choi Eun-seo (PR).</p><p>Existing act: CHERRYBOMB</p></section>';
if(page==='Save Manager')v.innerHTML='<section class="panel"><h2>Save manager</h2><p>Autosaves in this browser. Export a backup to move your save to another device.</p><button class="primary" data-export>Export save JSON</button><label>Import save backup</label><input type="file" id="importFile" accept=".json"><button data-import>Import save</button><p><button data-reset>Start a new game</button></p></section>';
save();
}
function escapeHTML(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function escapeAttr(s){return escapeHTML(s).replace(/'/g,'&#39;')}
function sign(id){let m=state.candidates.find(x=>x.id===id);if(!m||state.members.length>=7)return alert('Your lineup is full.');if(state.cash<m.fee)return alert('Insufficient funds.');state.cash-=m.fee;state.members.push(m);state.candidates=state.candidates.filter(x=>x.id!==id);note(m.name+' signed with ECLIPSE.');draw()}
function advance(){state.week++;if(state.week>4){state.week=1;state.month++;if(state.month>12){state.month=1;state.year++}state.cash-=60000000;note('Monthly operating expenses of ₩60M were paid.');if(state.cash<0){state.rep=clamp(state.rep-6);note('Cash-flow crisis: company reputation declined.')}}let p=pick([['VEIL7','Our next chapter is coming.'],['SERAPH','Studio until 3AM. The next record has to be worth the wait.'],['ROGUE','Seoul, you were loud tonight. Thank you.'],['CHERRYBOMB','Practice room diaries soon. Who wants to see?']]);state.posts.unshift({by:p[0],handle:'@'+p[0].toLowerCase(),text:p[1]});if(Math.random()<.4)note(pick(['A rival agency announced a new girl group project.','A producer contacted ECLIPSE about a collaboration.','A rookie group went viral with a new performance.','Rumors of a contract dispute are circulating.']));draw()}
$('#tabs').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
$('#app').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page)go(b.dataset.page);else if(b.hasAttribute('data-generate')){for(let i=0;i<5;i++)state.candidates.push(makeCandidate());note('Five new audition profiles arrived.');draw()}else if(b.dataset.sign)sign(b.dataset.sign);else if(b.dataset.profile){let m=state.members.concat(state.candidates).find(x=>x.id===b.dataset.profile);if(m)alert(m.name+' · '+m.age+' · '+m.trait+'\n'+m.story+'\nVocal '+m.vocal+' / Dance '+m.dance+' / Rap '+m.rap+' / Visual '+m.visual+' / Stage '+m.stage)}else if(b.hasAttribute('data-save-player')){state.player.name=$('#pName').value.trim()||'Han Mirae';state.player.stageName=$('#pStage').value.trim()||state.player.name;state.player.age=Number($('#pAge').value)||20;state.player.nationality=$('#pNation').value.trim();state.player.pronouns=$('#pPronouns').value;state.player.face=$('#pFace').value;state.player.hair=$('#pHair').value;state.player.eyes=$('#pEyes').value;state.player.style=$('#pStyle').value;state.player.bio=$('#pBio').value;note('Mirae updated her character profile.');draw()}else if(b.hasAttribute('data-save-group')){state.group=$('#groupName').value.trim();state.concept=$('#concept').value;state.fandom=$('#fandom').value.trim();note('Group identity updated: '+(state.group||'Unnamed')+'.');draw()}else if(b.hasAttribute('data-debut')){if(state.members.length<3)return alert('Recruit at least three members first.');state.debut=true;state.rep=clamp(state.rep+4);note((state.group||'Your group')+' began debut preparations.');draw()}else if(b.hasAttribute('data-post')){let t=$('#message').value.trim();if(!t)return;let neg=/hate|stupid|idiot|trash|fake|ugly/i.test(t),pos=/thank|grateful|love|excited|support|proud|music|fans/i.test(t),d=neg?-7:pos?5:rand(-2,2);state.rep=clamp(state.rep+d);state.pop=clamp(state.pop+(d>0?2:d<0?-2:0));state.posts.unshift({by:'Han Mirae @hanmirae_official',handle:'',text:t});note('Mirae posted on IDOLWIRE. Public response: '+(d>0?'positive':d<0?'negative':'mixed')+'.');draw()}else if(b.hasAttribute('data-next'))advance();else if(b.hasAttribute('data-export')){let u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='IDOLVERSE-save.json';a.click();URL.revokeObjectURL(u)}else if(b.hasAttribute('data-import')){let f=$('#importFile').files[0];if(!f)return alert('Choose a save file first.');let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);draw()}catch(e){alert('Invalid save file.')}};r.readAsText(f)}else if(b.hasAttribute('data-reset')&&confirm('Start over and erase this browser save?')){localStorage.removeItem('idolverse_save_v2');location.reload()}});
draw();
diagnostic.textContent='Game loaded successfully. If you can read this, IDOLVERSE has started.';
</script></body></html>
