function toggleMusic(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();musicOn=!musicOn;$('#muteBtn').textContent=musicOn?'♫ Music: On':'♫ Music: Muted';if(musicTimer)clearInterval(musicTimer);if(musicOn){let ns=[130.81,164.81,196,246.94,196,164.81],i=0;musicTimer=setInterval(()=>{let o=audioCtx.createOscillator(),v=audioCtx.createGain();o.type='sine';o.frequency.value=ns[i++%ns.length];v.gain.setValueAtTime(.0001,audioCtx.currentTime);v.gain.exponentialRampToValueAtTime(.014,audioCtx.currentTime+.3);v.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+2.5);o.connect(v);v.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+2.6)},700)}}
function showScene(speaker,line,choices){$('#vnBox').classList.remove('hidden');$('#reopenDialogue').classList.add('hidden');$('#vnSpeaker').textContent=speaker;$('#vnLine').textContent=line;$('#vnChoices').innerHTML=choices.map((x,i)=>'<button '+(i===0?'class="primary"':'')+' data-vchoice="'+i+'">'+esc(x.label)+'</button>').join('');$('#vnChoices').querySelectorAll('button').forEach((b,i)=>b.onclick=choices[i].run)}function chooseScene(k){if(k==='practice'){g.stats.dance=clamp(g.stats.dance+3);g.stats.stamina=clamp(g.stats.stamina-5);showScene('Mirae','The chorus finally lands cleanly. Your legs ache, but everyone is more in sync.',[{label:'Write down the formation',run:()=>{save();showScene('Mirae','You save the formation notes. What now?',[{label:'Check IDOLWIRE',run:()=>openPanel('social')},{label:'Talk to a member',run:()=>openPanel('people')},{label:'Plan the day',run:()=>openPanel('schedule')}])}}])}else if(k==='break'){g.stats.stamina=clamp(g.stats.stamina+8);showScene('Mirae','You ask for ten minutes. One of the members offers you water, and the room relaxes.',[{label:'Chat with the members',run:()=>openPanel('people')},{label:'Check your phone',run:()=>openPanel('phone')},{label:'Return to practice',run:()=>chooseScene('practice')}])}else openPanel('people');save()}function boot(){if(!g.posts.length)g.posts=[{id:'a',by:'IDOLWIRE NEWS',handle:'@idolwire_news',text:'The 2026 rookie race is heating up. Which agency will surprise everyone?',time:'2m',likes:1290},{id:'b',by:'CHERRYBOMB',handle:'@cherrybomb_official',text:'Practice room diaries soon. Who wants to see?',time:'8m',likes:875},{id:'c',by:'Yuna',handle:'@yuna_muse',text:'A little reminder to eat well and keep chasing your dreams.',time:'21m',likes:2300}];const artFrame=$('#artRenderer');let started=false;const startWithOriginalArt=()=>{if(started)return;const win=artFrame&&artFrame.contentWindow;if(!win||typeof win.IDOLVERSE_RENDER!=='function')return;try{const svg=win.IDOLVERSE_RENDER(g.player.appearance||{});if(!svg||!svg.includes('<svg'))return;started=true;g.player.customPortraitSvg=svg;$('#portrait').src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);init3d();refresh();save();}catch(err){console.error('Original Dressing Room renderer failed:',err);toast('Character artwork could not load.');}};if(artFrame){artFrame.addEventListener('load',startWithOriginalArt);startWithOriginalArt();let tries=0;const wait=setInterval(()=>{tries++;startWithOriginalArt();if(started||tries>=80)clearInterval(wait)},250);}else{toast('Original character renderer is missing.');}setInterval(()=>{if(Math.random()<.85)npcPost()},22000);$('#vnChoices').querySelectorAll('button').forEach(b=>b.onclick=()=>chooseScene(b.dataset.vchoice));}
window.addEventListener('error',e=>toast('Game error: '+e.message));boot();
</script></body></html>
