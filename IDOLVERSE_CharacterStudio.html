<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17111f">
<title>IDOLVERSE — Industry Simulator</title>
<style>
:root{--bg:#100d15;--side:#17121e;--panel:#201927;--panel2:#2a2033;--line:#3b2e46;--text:#f8f2fa;--muted:#b9aabd;--pink:#ed78b9;--violet:#a87ce0;--mint:#8bdbbd;--gold:#f0c878;--red:#e58b91}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}button:hover{border-color:var(--pink)}button.primary{background:linear-gradient(120deg,#8748ae,#d45c9c);border:0;font-weight:750}button.danger{border-color:#78434e;color:#ffc1c1}button:disabled{opacity:.35;cursor:not-allowed}input,select,textarea{width:100%;background:#120e18;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}textarea{min-height:76px;resize:vertical}label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.sidebar{background:var(--side);border-right:1px solid var(--line);padding:17px 12px;display:flex;flex-direction:column;gap:8px}.brand{padding:10px 10px 18px}.brand b{font-size:23px;letter-spacing:-1px}.brand small{display:block;color:var(--muted);letter-spacing:1.5px;font-size:9px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{text-align:left;background:transparent;border-color:transparent;padding:11px}.nav button.active{background:#382542;border-color:#63416f;color:#ffd7f0}.sidebottom{margin-top:auto}.main{min-width:0;padding:20px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:17px}.eyebrow{font-size:10px;letter-spacing:1.8px;color:var(--pink);font-weight:800}.title{font-size:27px;font-weight:850;letter-spacing:-.8px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;min-width:0}.hero{background:linear-gradient(125deg,#271638,#673665 60%,#30213e);border:1px solid #654675;border-radius:17px;padding:20px;margin-bottom:14px}.hero h1{font-size:30px;margin:4px 0;letter-spacing:-1px}.stat{background:#17121d;border:1px solid var(--line);border-radius:11px;padding:11px}.stat small{color:var(--muted);font-size:11px}.stat strong{display:block;font-size:20px;margin-top:3px}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.wrap{display:flex;flex-wrap:wrap;gap:6px}.pill{display:inline-block;border:1px solid var(--line);border-radius:30px;padding:3px 8px;font-size:10px;color:#eac9f3}.bar{height:6px;border-radius:9px;background:#3a2e42;overflow:hidden}.bar span{height:100%;display:block;background:linear-gradient(90deg,var(--violet),var(--pink))}.candidate{background:#191420;border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0}.candidate h3{margin:0;font-size:15px}.candidate p{margin:6px 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1}.feedpost{background:#191420;border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0}.feedpost p{white-space:pre-wrap;margin:9px 0}.avatar{width:39px;height:39px;border-radius:50%;background:linear-gradient(135deg,#b57be0,#e875ad);display:grid;place-items:center;color:#24142e;font-weight:900;flex-shrink:0}.feedhead{display:flex;gap:9px;align-items:center}.feedhead small{display:block;color:var(--muted)}.metric{font-size:11px;color:var(--muted)}.notice{padding:11px;background:#30223a;border:1px solid #61416f;border-radius:11px;margin:10px 0;font-size:12px}.good{color:var(--mint)}.bad{color:#ffaaaa}.gold{color:var(--gold)}.hidden{display:none!important}.split{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px}.sectionhead{font-weight:800;font-size:17px;margin:0 0 4px}.progress{margin:8px 0}.progress .row{font-size:11px;margin-bottom:4px}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.modalbg{position:fixed;inset:0;background:#08060bcc;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:#1d1725;border:1px solid #594264;border-radius:17px;padding:18px;box-shadow:0 20px 90px #0009}.modalbg.open{display:flex}.close{float:right}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#392746;border:1px solid #825a96;padding:11px 16px;border-radius:12px;z-index:30;display:none;max-width:90%;text-align:center}.empty{padding:25px;text-align:center;color:var(--muted)}.calendar{display:flex;gap:7px;align-items:center}.phonehint{font-size:11px;color:var(--muted);text-align:center;margin-top:15px}
@media(max-width:760px){.app{display:block}.sidebar{position:sticky;top:0;z-index:10;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px;display:block}.brand{display:flex;align-items:center;justify-content:space-between;padding:3px 5px 8px}.brand b{font-size:19px}.brand small{font-size:8px}.nav{flex-direction:row;overflow:auto}.nav button{white-space:nowrap;padding:8px 10px;font-size:12px}.sidebottom{display:none}.main{padding:12px}.title{font-size:23px}.split{grid-template-columns:1fr}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:26px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div><b>IDOLVERSE</b><small>THE INDUSTRY IS YOURS</small></div><span class="pill">2026</span></div>
 <nav class="nav" id="nav">
  <button data-page="dashboard" class="active">◈ Dashboard</button><button data-page="group">♬ My Group</button><button data-page="auditions">✧ Auditions</button><button data-page="social">◎ Social Feed</button><button data-page="people">♡ Relationships</button><button data-page="industry">▦ Industry</button><button data-page="customize">✎ Customize</button><button data-page="finances">₩ Finances</button><button data-page="saves">▣ Save Manager</button>
 </nav>
 <div class="sidebottom card"><div class="eyebrow">YOUR AGENCY</div><b>ECLIPSE Entertainment</b><div class="muted small">Independent · Seoul</div><div class="small" style="margin-top:9px">Company standing</div><div class="bar"><span id="sideRep" style="width:32%"></span></div><div class="small muted" id="sideDate">Oct 2026 · W1</div></div>
</aside>
<main class="main">
 <header class="top"><div><div class="eyebrow" id="eyebrow">ECLIPSE ENTERTAINMENT</div><div class="title" id="pageTitle">Executive Dashboard</div></div><div class="calendar"><span class="pill" id="datePill">OCT 2026 · W1</span><button class="primary" id="advance">Next week →</button></div></header>
 <div id="content"></div>
 <div class="phonehint">IDOLVERSE · Local simulation · Use Save Manager to create backup files</div>
</main>
</div>
<div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
(()=>{
const $=s=>document.querySelector(s), pick=a=>a[Math.floor(Math.random()*a.length)], rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, clamp=n=>Math.max(0,Math.min(100,n));
const names=['Kim Seoyeon','Park Yejin','Lee Sumin','Choi Minji','Kang Nari','Jung Chaewon','Han Yuna','Yoon Seulgi','Oh Jiwon','Shin Haeun','Baek Sohee','Kwon Ara','Lim Daeun','Moon Jisoo','Song Hyerin','Ryu Eunchae','Jang Sora','Nam Hyejin','Bae Jihye','Hong Minseo','Mori Airi','Nakamura Rin','Chen Xinyi','Choi Mira'];
const personalities=['Ambitious','Reserved','Bubbly','Competitive','Perfectionist','Easygoing','Independent','Sensitive','Charismatic','Mischievous','Disciplined','Stubborn','Flirtatious','Cynical','People-pleaser'];
const histories=['Former trainee at a major agency; eliminated before debut.','Classically trained vocalist discovered at a competition.','Dance academy standout with a growing social following.','Moved to Seoul alone to pursue an entertainment career.','Former child performer returning after a long break.','Survival-show contestant who narrowly missed the final lineup.','Self-taught rapper who uploaded music anonymously.','Trained for six years but never passed a monthly evaluation.','Studied music production and wants to write her own songs.','Former athlete with exceptional stamina and stage presence.','Viral dance-cover creator with no formal trainee experience.','Was scouted at a university festival.','Comes from a family with strong entertainment-industry connections.','Has been supporting her family while training part-time.'];
const randName=()=>pick(names);
const makeIdol=()=>({id:Math.random().toString(36).slice(2,10),name:randName(),stageName:'',age:rnd(16,25),nationality:Math.random()<.86?'South Korean':pick(['Japanese','Thai','Chinese','American','Canadian']),vocal:rnd(40,99),dance:rnd(40,99),rap:rnd(25,98),visual:rnd(45,99),stage:rnd(35,98),personality:pick(personalities),history:pick(histories),experience:rnd(0,8),fee:rnd(3,12)*1000000,secret:pick(['Has a former agency connection.','Privately worries about her abilities.','Has a strong competitive streak.','Wants to become a songwriter.','Has family pressure to succeed.','Has a close friend at another agency.','Is quietly seeing someone outside the industry.']),positions:[],trust:50,affection:0,stress:rnd(10,40),energy:rnd(65,100),morale:rnd(55,90),isPlayer:false});
const staff=()=>[{name:'Kang Tae-jun',role:'Operations Director',personality:'Reserved, analytical',opinion:42,topic:'The budget needs to be protected. We cannot afford an expensive mistake.'},{name:'Seo Hye-jin',role:'Artist Development Director',personality:'Demanding, perceptive',opinion:65,topic:'I want to find girls with real potential, not just attractive profiles.'},{name:'Lee Do-hyun',role:'A&R Manager',personality:'Creative, impulsive',opinion:57,topic:'We need an identity. I do not want another generic pop group.'},{name:'Choi Eun-seo',role:'Public Relations Manager',personality:'Calculating, articulate',opinion:50,topic:'The public remembers your first impression.'}];
const initial=()=>({version:2,player:{name:'Han Mirae',age:20,nationality:'South Korean',hair:'Black',style:'Classic chic',bio:'A new face in the entertainment industry.',stageName:'Mirae',appearance:{skin:'#a96f55',hair:'#211a25',hair2:'#5b405f',iris:'#8b735d',lip:'#bd718a',makeup:'#b76a86',outfit:'#59416f',trim:'#e58bbd',face:'soft',eyes:'almond',hairStyle:'long',bangs:'curtain',expression:'gentle',makeupStyle:'soft',outfitStyle:'stage',accessory:'none'}},company:'ECLIPSE Entertainment',month:10,year:2026,week:1,cash:850000000,rep:32,pop:12,fan:0,influence:19,credibility:25,groupName:'',concept:'Elegant',members:[],pool:Array.from({length:12},makeIdol),staff:staff(),feed:[],relationships:[],news:[],debut:false,posts:0,scandals:0,events:[],missions:['Recruit at least three trainees','Choose your group name and concept','Build your pre-debut presence'],slotName:'Mirae — New CEO'});
let s=initial(),page='dashboard',selectedId=null,modalCallback=null;
const fmt=n=>'₩'+Math.round(n/1e6).toLocaleString()+'M',date=()=>`${new Date(s.year,s.month-1,1).toLocaleString('en-US',{month:'short'}).toUpperCase()} ${s.year} · W${s.week}`;
function notify(t){let el=$('#toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2400)}
function log(text,type='info'){s.events.unshift({date:date(),text,type});s.events=s.events.slice(0,70)}
function post(author,handle,text,kind='idol',stats={}){s.feed.unshift({id:Math.random().toString(36).slice(2),author,handle,text,kind,likes:stats.likes??rnd(8,9000),comments:stats.comments??rnd(0,230),time:date(),mine:!!stats.mine});s.feed=s.feed.slice(0,100)}
function positions(p){let a=[];[['Main Vocalist',p.vocal],['Main Dancer',p.dance],['Main Rapper',p.rap]].forEach(([n,v])=>{if(v>=84)a.push(n);else if(v>=72)a.push(n.replace('Main','Lead'))});if(p.visual>=86)a.push('Visual');if(p.stage>=88)a.push('Center');if(!a.length)a.push(p.vocal>=p.dance?'Sub Vocalist':'Sub Dancer');return [...new Set(a)]}
function persist(){try{localStorage.setItem('idolverse_autosave',JSON.stringify(s))}catch(e){}}
function stat(label,value){return `<div class="stat"><small>${label}</small><strong>${value}</strong></div>`}
function meter(label,n){return `<div class="progress"><div class="row"><span>${label}</span><b>${n}/100</b></div><div class="bar"><span style="width:${clamp(n)}%"></span></div></div>`}
function card(title,sub,body){return `<section class="card"><h2 class="sectionhead">${title}</h2><div class="muted small">${sub||''}</div>${body}</section>`}
function pill(x){return `<span class="pill">${x}</span>`}
function avatar(name){return `<div class="avatar">${(name||'?').split(' ').map(x=>x[0]).slice(0,2).join('')}</div>`}
function postHTML(p){return `<article class="feedpost"><div class="feedhead">${avatar(p.author)}<div style="flex:1"><b>${p.author}</b> <span class="muted small">${p.handle}</span><small>${p.time}</small></div>${p.kind==='official'?pill('OFFICIAL'):''}</div><p>${esc(p.text)}</p><div class="row small muted"><span>♡ ${p.likes.toLocaleString()} likes</span><span>▢ ${p.comments} replies</span><button data-act="like" data-id="${p.id}">♡ Like</button></div></article>`}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dashboard(){return `<div class="hero"><div class="eyebrow">WELCOME BACK, CEO HAN</div><h1>Make your mark.</h1><div class="muted">The next generation of K-pop starts at ECLIPSE.</div><div class="wrap" style="margin-top:12px">${pill('Independent agency')}${pill('Pre-debut era')}${pill('Hybrid hardcore')}</div></div><div class="grid3">${stat('Company funds',fmt(s.cash))}${stat('Reputation',s.rep+'/100')}${stat('Public recognition',s.pop+'/100')}${stat('Fan loyalty',s.fan+'/100')}${stat('Industry influence',s.influence+'/100')}${stat('Musical credibility',s.credibility+'/100')}</div><div class="grid" style="margin-top:12px"><div>${card('Current objectives','Your immediate priorities',`<ul>${s.missions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="actions"><button class="primary" data-page="auditions">Recruit trainees</button><button data-page="group">Manage group</button></div>`)}</div><div>${card('Industry pulse','What is happening around you',s.events.slice(0,5).map(e=>`<div class="feedpost small"><span class="muted">${e.date}</span><br>${esc(e.text)}</div>`).join('')||'<p class="muted">The industry is waiting for your first move.</p>')}</div></div>`}
function idolCard(p,source){return `<article class="candidate"><div class="row">${`<div><h3>${esc(p.stageName||p.name)}</h3><div class="muted small">${esc(p.name)} · ${p.age} · ${esc(p.nationality)}</div></div>`}${pill(p.personality)}</div><div class="wrap" style="margin:7px 0">${(p.positions||[]).map(pill).join('')}</div><div class="grid">${[['Vocal',p.vocal],['Dance',p.dance],['Rap',p.rap],['Visual',p.visual],['Stage',p.stage]].map(([a,b])=>`<div>${meter(a,b)}</div>`).join('')}</div><p>${esc(p.history)}</p><div class="actions"><button data-act="profile" data-id="${p.id}">Full profile</button>${source==='pool'?`<button class="primary" data-act="recruit" data-id="${p.id}" ${s.members.length>=7?'disabled':''}>Recruit · ${fmt(p.fee)}</button>`:`<button data-act="remove" data-id="${p.id}">Remove</button>`}</div></article>`}
function auditions(){return card('Audition room','Recruitment · Up to seven members',`<div class="row"><span class="muted small">${s.pool.length} active candidates</span><button data-act="generate">+ Generate 5</button></div>${s.pool.map(p=>idolCard(p,'pool')).join('')||'<div class="empty">No candidates left. Generate more audition profiles.</div>'}`)}
function group(){return `<div class="grid"><div>${card('Group identity','Set the public-facing identity',`<label>Group name</label><input id="groupName" maxlength="24" value="${esc(s.groupName)}" placeholder="e.g. ASTRÉA"><label>Concept</label><select id="concept">${['Elegant','Girl crush','Dreamy','Teen fresh','Dark fantasy','Experimental','Retro','R&B','Powerful performance','Y2K pop','Art-pop'].map(x=>`<option ${s.concept===x?'selected':''}>${x}</option>`).join('')}</select><label>Fandom name (optional)</label><input id="fandom" value="${esc(s.fandom||'')}" placeholder="Name your fandom"><div class="actions"><button data-act="saveGroup" class="primary">Save identity</button><button data-act="debut" ${s.members.length<3||s.debut?'disabled':''}>Start debut campaign</button></div>${s.debut?'<div class="notice good">Debut campaign is underway. Group has not released its debut single yet.</div>':''}`)}</div><div>${card('Lineup overview','Position assignments are generated from ability scores',`<div class="grid3">${stat('Members',s.members.length+'/7')}${stat('Average vocal',avg('vocal'))}${stat('Average dance',avg('dance'))}</div><p class="muted small">The oldest member is eligible for leader nomination; positions can be edited in Customize.</p>`)}</div></div>${card('Members','Open an individual profile to inspect history and relationships',s.members.map(p=>idolCard(p,'member')).join('')||'<div class="empty">No members recruited yet. Visit Auditions to build your lineup.</div>')}`}
function avg(k){return s.members.length?Math.round(s.members.reduce((a,p)=>a+p[k],0)/s.members.length):'—'}
function social(){return `<div class="split"><div>${card('IDOLWIRE','A fictional social network for idols, fans, companies and media',`<div class="muted small">Posts can shift public sentiment, relationships, and reputation. NPCs also post and react independently.</div><label>What would Mirae post?</label><textarea id="postText" maxlength="280" placeholder="Write a post..."></textarea><div class="row"><span class="muted small" id="charCount">0 / 280</span><button class="primary" data-act="publish">Publish post</button></div><div class="wrap" style="margin-top:10px"><button data-act="feedAll">For You</button><button data-act="feedIdols">Idols</button><button data-act="feedNews">News</button></div>${s.feed.map(postHTML).join('')||'<div class="empty">No posts yet. Publish your first post or advance the week to see the industry come alive.</div>'}`)}</div><div>${card('Trending now','Public mood and online activity',`<div class="candidate"><b>#ECLIPSE</b><p>New agency watching brief</p><span class="muted small">Early industry curiosity</span></div><div class="candidate"><b>#ComebackSeason</b><p>Several established groups preparing releases.</p></div><div class="candidate"><b>#RookieWatch</b><p>Fans are looking for the next breakout act.</p></div><h3 class="sectionhead">Your online standing</h3>${meter('Public recognition',s.pop)}${meter('Reputation',s.rep)}${meter('Fan loyalty',s.fan)}`)}</div></div>`}
function people(){return card('Relationships & NPCs','Staff and idols form opinions over time.',`${s.staff.map((p,i)=>`<article class="candidate"><div class="row"><div><h3>${p.name}</h3><p>${p.role} · ${p.personality}</p></div>${pill('Staff')}</div>${meter('Opinion of Mirae',p.opinion)}<p>“${p.topic}”</p><button data-act="talk" data-id="${i}">Start conversation</button></article>`).join('')}${s.members.map(p=>`<article class="candidate"><h3>${p.name}</h3><p>Member · ${p.personality}</p>${meter('Trust',p.trust)}${meter('Morale',p.morale)}${meter('Stress',p.stress)}<button data-act="memberTalk" data-id="${p.id}">Talk privately</button></article>`).join('')||'<p class="muted">Recruit idols to unlock member relationships.</p>'}`)}
function industry(){return card('The K-pop industry','Ten competing agencies operate independently in this world.',`<div class="grid">${[['VANTA Entertainment','Major · Performance and luxury'],['AURELIS Media','Major · Vocal and songwriting'],['BLACKLINE Entertainment','Major · Hip-hop and global branding'],['LUMIÈRE Entertainment','Major · Girl groups and public recognition'],['NOVA Entertainment','Mid-size · Boy groups and touring'],['ORBIT Music','Mid-size · Experimental pop'],['HANEUL Entertainment','Mid-size · Vocal groups'],['MUSE Collective','Independent · Soloists'],['ECLIPSE Entertainment','Your agency · Viral marketing'],['CROWN Entertainment','Independent · Trainee development']].map(([a,b])=>`<div class="candidate"><b>${a}</b><p>${b}</p><span class="muted small">Active in the 2026 market</span></div>`).join('')}</div><h3 class="sectionhead">Industry headlines</h3>${s.events.map(e=>`<div class="feedpost small"><span class="muted">${e.date}</span><br>${esc(e.text)}</div>`).join('')}`)}
function customize(){
 const A=s.player.appearance||(s.player.appearance={skin:'#a96f55',hair:'#211a25',hair2:'#5b405f',iris:'#8b735d',lip:'#bd718a',makeup:'#b76a86',outfit:'#59416f',trim:'#e58bbd',face:'soft',eyes:'almond',hairStyle:'long',bangs:'curtain',expression:'gentle',makeupStyle:'soft',outfitStyle:'stage',accessory:'none'});
 const opts=(key,arr)=>`<div class="studio-options">${arr.map(x=>`<button type="button" class="studio-chip ${A[key]===x?'on':''}" data-look="${key}" data-value="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>`;
 const color=(key,label)=>`<label class="studio-color">${label}<span><input type="color" data-color="${key}" value="${A[key]}"><code>${A[key]}</code></span></label>`;
 const face=`<div class="studio-controls"><h3>Face</h3>${opts('face',['soft','oval','heart','round','sharp'])}${opts('eyes',['almond','doe','cat','sleepy','upturned','round'])}${opts('expression',['gentle','smile','shy','confident','serious','surprised'])}${color('skin','Skin tone')}${color('iris','Eye color')}${color('lip','Lip color')}</div>`;
 const hair=`<div class="studio-controls"><h3>Hair</h3>${opts('hairStyle',['long','wavy','bob','hime','ponytail','twin tails','braid','layered','updo'])}${opts('bangs',['curtain','straight','wispy','side swept','none'])}${color('hair','Main hair color')}${color('hair2','Highlight / ombré')}</div>`;
 const makeup=`<div class="studio-controls"><h3>Makeup</h3>${opts('makeupStyle',['none','natural','soft','glam','smoky','stage'])}${color('makeup','Makeup color')}</div>`;
 const outfit=`<div class="studio-controls"><h3>Outfits</h3>${opts('outfitStyle',['practice','casual','preppy','streetwear','stage','elegant','airport','school'])}${color('outfit','Main outfit color')}${color('trim','Trim / detail color')}</div>`;
 const accessory=`<div class="studio-controls"><h3>Accessories</h3>${opts('accessory',['none','earrings','hair clips','ribbon','headband','choker','glasses','headset','tiara'])}</div>`;
 const active=({Face:face,Hair:hair,Makeup:makeup,Outfits:outfit,Accessories:accessory})[studioTab]||face;
 return `<div class="studio-wrap">
 <section class="studio-preview"><div class="studio-kicker">IDOLVERSE · CHARACTER STUDIO</div><div class="studio-stage">${animePortrait(A)}<div class="studio-name">${esc(s.player.name)}</div><div class="studio-sub">PLAYER CHARACTER · ECLIPSE ENTERTAINMENT</div></div>
 <div class="studio-actions"><button class="primary" data-act="randomLook">✧ Randomize look</button><button data-act="resetLook">Reset look</button></div></section>
 <section class="studio-editor"><div class="studio-heading"><div><div class="eyebrow">APPEARANCE EDITOR</div><h2>Customize Mirae</h2><p class="muted small">Choose individual features, colors, makeup and wardrobe. Changes preview instantly.</p></div><span class="pill">Autosaved</span></div>
 <div class="studio-tabs">${['Face','Hair','Makeup','Outfits','Accessories'].map(t=>`<button class="${studioTab===t?'active':''}" data-studiotab="${t}">${t}</button>`).join('')}</div>${active}
 <div class="studio-controls identity"><h3>Identity</h3><div class="grid"><div><label>Legal name</label><input id="pName" value="${esc(s.player.name)}"></div><div><label>Stage name</label><input id="pStage" value="${esc(s.player.stageName||'Mirae')}"></div></div><label>Character bio</label><textarea id="pBio">${esc(s.player.bio)}</textarea><button class="primary" data-act="savePlayer">Save Mirae</button></div>
 </section></div>
 <style>
 .studio-wrap{display:grid;grid-template-columns:minmax(260px,.85fr) minmax(300px,1.15fr);gap:14px;align-items:start}
 .studio-preview,.studio-editor{background:linear-gradient(145deg,#21162d,#17111f);border:1px solid #604477;border-radius:20px;padding:16px;min-width:0}
 .studio-kicker,.studio-sub{font-size:10px;letter-spacing:2px;color:#d5a4db;text-align:center}
 .studio-stage{min-height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#65446f,#251a32 68%);border-radius:16px;margin:12px 0;padding:12px;overflow:hidden}
 .studio-portrait{width:min(100%,340px);height:auto;filter:drop-shadow(0 18px 18px #08050c88)}
 .studio-name{font-size:21px;font-weight:800;color:#f2b4d6;margin-top:4px}.studio-actions{display:flex;gap:8px;flex-wrap:wrap}
 .studio-heading{display:flex;justify-content:space-between;gap:8px;align-items:center}.studio-heading h2{margin:4px 0}
 .studio-tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0;padding-bottom:5px}.studio-tabs button{white-space:nowrap}.studio-tabs button.active{background:linear-gradient(120deg,#8748ae,#d45c9c);border-color:transparent}
 .studio-controls{border-top:1px solid #44334e;padding:14px 0}.studio-controls h3{margin:0 0 12px}.studio-options{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 16px}.studio-chip{border-radius:12px;padding:8px 10px;font-size:12px}.studio-chip.on{background:#70418b;border-color:#e88bc0;color:#fff}
 .studio-color{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}.studio-color span{display:flex;align-items:center;gap:8px}.studio-color input{width:48px;height:38px;padding:3px}.studio-color code{font-size:11px;color:#d9bddf}
 .identity{margin-top:10px}.identity .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 @media(max-width:760px){.studio-wrap{grid-template-columns:1fr}.studio-stage{min-height:360px}.studio-portrait{max-height:360px}.studio-preview{position:relative}.studio-editor{padding:12px}}
 </style>`;
}
function animePortrait(a){
 const skin=a.skin||'#a96f55',hair=a.hair||'#211a25',hair2=a.hair2||'#5b405f',iris=a.iris||'#8b735d',lip=a.lip||'#bd718a',make=a.makeup||'#b76a86',out=a.outfit||'#59416f',trim=a.trim||'#e58bbd';
 const bangs=a.bangs==='none'?'':a.bangs==='straight'?'M90 145Q150 95 210 145L205 172Q150 150 95 172Z':a.bangs==='side swept'?'M88 150Q125 72 218 115Q178 142 116 178Z':a.bangs==='wispy'?'M92 143Q110 105 130 132L138 160L151 128L166 158L184 123L210 151Z':'M88 145Q112 105 150 119Q188 105 212 145Q184 132 150 150Q116 132 88 145Z';
 const hairShape=a.hairStyle==='bob'?'M67 170Q58 45 150 44Q242 45 233 170L222 300L196 282L190 160L110 160L104 282L78 300Z':a.hairStyle==='ponytail'?'M68 168Q56 46 150 44Q244 46 232 168L214 240L242 310Q218 346 198 300L190 160L110 160L100 300L78 310Z':'M62 170Q55 40 150 38Q245 40 238 170L232 430L195 398L188 165L112 165L105 398L68 430Z';
 const eyes=a.eyes==='sleepy'?'M103 198Q125 184 143 198Q124 210 103 198ZM157 198Q175 184 197 198Q176 210 157 198Z':a.eyes==='cat'?'M100 198L145 190Q126 218 100 198ZM155 190L200 198Q174 218 155 190Z':'M101 198Q122 166 145 198Q124 225 101 198ZM155 198Q178 166 199 198Q176 225 155 198Z';
 const outfitShape=a.outfitStyle==='practice'?'M88 320Q150 292 212 320L230 430H70Z':a.outfitStyle==='elegant'?'M86 315Q150 292 214 315L242 440H58Z':'M88 315Q150 292 212 315L228 440H72Z';
 const accessory=a.accessory==='none'?'':a.accessory==='glasses'?'<g fill="none" stroke="#e7d8d4" stroke-width="4"><circle cx="123" cy="199" r="25"/><circle cx="177" cy="199" r="25"/><path d="M148 199H152"/></g>':a.accessory==='ribbon'?`<path d="M190 72L160 48L164 91Z M190 72L220 48L216 91Z" fill="${trim}" stroke="#21151e" stroke-width="3"/>`:`<circle cx="94" cy="140" r="9" fill="${trim}"/><circle cx="206" cy="140" r="9" fill="${trim}"/>`;
 return `<svg class="studio-portrait" viewBox="0 0 300 450" role="img" aria-label="Anime-style portrait of ${esc(s.player.name)}"><defs><linearGradient id="hairG" x2="0" y2="1"><stop stop-color="${hair}"/><stop offset="1" stop-color="${hair2}"/></linearGradient><linearGradient id="skinG" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".2"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></linearGradient></defs>
 <ellipse cx="150" cy="430" rx="100" ry="10" fill="#09060c" opacity=".5"/>
 <path d="${outfitShape}" fill="${out}" stroke="#21151e" stroke-width="4"/><path d="M112 320L150 365L188 320" fill="none" stroke="${trim}" stroke-width="7"/>
 <path d="${hairShape}" fill="url(#hairG)" stroke="#21151e" stroke-width="4"/>
 <path d="M82 130Q80 62 150 60Q220 62 218 130L213 230Q207 290 150 310Q93 290 87 230Z" fill="${skin}" stroke="#241720" stroke-width="3"/>
 <path d="M82 130Q85 62 150 60Q215 62 218 130L212 155Q180 125 150 132Q120 125 88 155Z" fill="url(#hairG)"/>
 <path d="${bangs}" fill="url(#hairG)" stroke="#21151e" stroke-width="2"/>
 <path d="${eyes}" fill="#fff" stroke="#281b25" stroke-width="4"/><ellipse cx="125" cy="198" rx="9" ry="15" fill="${iris}"/><ellipse cx="175" cy="198" rx="9" ry="15" fill="${iris}"/><ellipse cx="125" cy="198" rx="4" ry="9" fill="#21151e"/><ellipse cx="175" cy="198" rx="4" ry="9" fill="#21151e"/><circle cx="128" cy="192" r="4" fill="#fff"/><circle cx="178" cy="192" r="4" fill="#fff"/>
 <path d="M100 174Q122 160 144 174M156 174Q178 160 200 174" fill="none" stroke="${hair}" stroke-width="6" stroke-linecap="round"/>
 <path d="M146 220Q150 226 154 220" fill="none" stroke="#9b655e" stroke-width="2"/><path d="M136 246Q150 258 164 246" fill="none" stroke="${lip}" stroke-width="5" stroke-linecap="round"/>
 <ellipse cx="104" cy="233" rx="14" ry="6" fill="${make}" opacity=".35"/><ellipse cx="196" cy="233" rx="14" ry="6" fill="${make}" opacity=".35"/>
 ${accessory}</svg>`;
}
let studioTab='Face';

function finances(){return card('Financial management','Company cashflow and operating costs',`<div class="grid3">${stat('Cash reserves',fmt(s.cash))}${stat('Monthly operating costs','₩60M')}${stat('Estimated runway',s.cash>0?Math.floor(s.cash/60000000)+' months':'Insolvent')}</div><h3 class="sectionhead">Monthly expenses</h3>${[['Staff salaries','₩32M'],['Building and facilities','₩12M'],['Trainee expenses','₩9M'],['Other operations','₩7M']].map(([a,b])=>`<div class="row" style="padding:9px;border-bottom:1px solid var(--line)"><span>${a}</span><b>${b}</b></div>`).join('')}<div class="notice">Recruitment costs are deducted immediately. Monthly costs are paid every four weeks. Negative cash damages company reputation.</div>`)}
function saves(){return card('Save manager','Your progress is autosaved in this browser. Export backups to move between devices.',`<div class="notice">Autosave is active. Browser storage is local to this device and browser; exported JSON backups are the portable save format.</div><div class="actions"><button class="primary" data-act="export">Export save file</button><button data-act="saveNow">Save now</button></div><label>Import a previous IDOLVERSE JSON save</label><input type="file" id="importFile" accept=".json,application/json"><div class="actions"><button data-act="import">Import selected save</button><button class="danger" data-act="reset">Delete save / New game</button></div><h3 class="sectionhead">Save summary</h3><div class="grid">${stat('Character',s.player.name)}${stat('Group members',s.members.length)}${stat('Date',date())}${stat('Feed posts',s.feed.length)}</div>`)}
const pages={dashboard,group,auditions,social,people,industry,customize,finances,saves};
function render(){const labels={dashboard:'Executive Dashboard',group:'Group Management',auditions:'Trainee Auditions',social:'IDOLWIRE · Social Media',people:'Relationships',industry:'Industry Directory',customize:'Character Studio',finances:'Company Finances',saves:'Save Manager'};$('#pageTitle').textContent=labels[page];$('#content').innerHTML=pages[page]();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#datePill').textContent=date();$('#sideDate').textContent=date();$('#sideRep').style.width=s.rep+'%';persist()}
function modal(title,body){$('#modal').innerHTML=`<button class="close" onclick="document.getElementById('modalbg').classList.remove('open')">✕</button><h2>${title}</h2>${body}`;$('#modalbg').classList.add('open')}
function socialReaction(text){let t=text.toLowerCase(),positive=['thank','grateful','love','excited','support','sorry','apolog','proud','music','fans','hard work','please'];let negative=['hate','stupid','idiot','shut up','annoy','boring','trash','whatever','fake','ugly'];let pos=positive.filter(x=>t.includes(x)).length,neg=negative.filter(x=>t.includes(x)).length;let delta=clamp(50+pos*9-neg*13+rnd(-12,12))-50;return delta}
function npcActivity(){let pool=[['VEIL7','@veil7_official','Our new chapter is coming. We hope you will stay with us.'],['SERAPH','@seraph_official','Studio until 3AM. The next record has to be worth the wait.'],['ROGUE','@rogue_members','Seoul, you were loud tonight. Thank you.'],['ROSÉLLE','@roselle_official','A little glimpse of what we have been preparing.'],['CHERRYBOMB','@cherrybomb_official','Practice room diaries soon. Who wants to see?'],['Han Yerin','@yerin.archive','Some people are only supportive when you are behind them.']];let n=pick(pool);post(n[0],n[1],n[2],'idol');if(Math.random()<.35){let p=pick(s.staff);p.opinion=clamp(p.opinion+rnd(-2,3));}if(Math.random()<.25&&s.members.length){let m=pick(s.members);post(m.stageName||m.name,'@'+(m.stageName||m.name).toLowerCase().replace(/[^a-z]/g,''),'Practice was exhausting today, but I think we are getting better.','idol');}}
function advance(){s.week++;if(s.week>4){s.week=1;s.month++;if(s.month>12){s.month=1;s.year++}s.cash-=60000000;log('Monthly operating expenses of ₩60M were paid.');if(s.cash<0){s.rep=clamp(s.rep-6);log('The company is facing a cash-flow crisis. Reputation declined.','negative')}else log('A new month begins at ECLIPSE.');}npcActivity();if(Math.random()<.35){let ev=pick(['A rival agency announced plans for a new girl group.','A producer contacted ECLIPSE about a possible collaboration.','A trainee evaluation caused tension among candidates.','A popular idol group went viral with a new performance.','An entertainment journalist published an industry analysis.','Rumors of a contract dispute are circulating in the industry.']);log(ev);post('IDOLWIRE NEWS','@idolwire_news',ev,'official')}render()}
function act(a,id){let p;
if(a==='generate'){for(let i=0;i<5;i++)s.pool.push(makeIdol());log('Five new audition profiles have arrived.');notify('Five candidates generated.')}
if(a==='recruit'){p=s.pool.find(x=>x.id===id);if(!p||s.members.length>=7)return;if(s.cash<p.fee){notify('Insufficient funds.');return}s.cash-=p.fee;p.positions=positions(p);if(p.age===Math.min(...s.members.map(x=>x.age),p.age))p.positions.push('Maknae');s.members.push(p);s.pool=s.pool.filter(x=>x.id!==id);log(p.name+' signed with ECLIPSE.');notify(p.name+' recruited.')}
if(a==='remove'){p=s.members.find(x=>x.id===id);if(p){s.members=s.members.filter(x=>x.id!==id);s.pool.push(p);log(p.name+' was removed from the debut lineup.');}}
if(a==='profile'){p=s.pool.find(x=>x.id===id)||s.members.find(x=>x.id===id);if(p)modal(esc(p.name),`<p>${p.age} · ${p.nationality} · ${p.experience} years training</p><p><b>Personality:</b> ${p.personality}</p><p><b>Background:</b> ${p.history}</p><p><b>Private detail:</b> ${p.secret}</p><p><b>Positions:</b> ${(p.positions||[]).join(', ')||'Not assigned'}</p>${meter('Vocal',p.vocal)}${meter('Dance',p.dance)}${meter('Rap',p.rap)}${meter('Visual',p.visual)}${meter('Stage presence',p.stage)}`);return}
if(a==='saveGroup'){s.groupName=$('#groupName').value.trim();s.concept=$('#concept').value;s.fandom=$('#fandom').value.trim();log('Group identity saved: '+(s.groupName||'Unnamed')+' · '+s.concept+'.');notify('Group identity saved.')}
if(a==='debut'){if(s.members.length<3||s.debut)return;s.groupName=$('#groupName').value.trim()||'UNTITLED';s.concept=$('#concept').value;s.debut=true;s.rep=clamp(s.rep+4);log(s.groupName+' began its debut preparation.');notify('Debut campaign initiated.')}
if(a==='talk'){p=s.staff[+id];let lines=[p.topic,'I hope you understand that this decision has consequences.','I have been thinking about the company’s future. We need to be strategic.','I am not sure I agree with your approach, but I will hear you out.'];modal(p.name,`<p class="muted">${p.role} · ${p.personality}</p><div class="notice">“${pick(lines)}”</div><p>How will you respond?</p><div class="actions"><button data-response="support" data-id="${id}">Thank them</button><button data-response="dismiss" data-id="${id}">Dismiss concern</button><button data-response="challenge" data-id="${id}">Challenge them</button></div>`);return}
if(a==='memberTalk'){p=s.members.find(x=>x.id===id);if(p)modal(p.name,`<p>${p.personality} · ${p.age}</p><div class="notice">“I wanted to talk to you about how things have been going lately.”</div><div class="actions"><button data-memberresponse="encourage" data-id="${id}">Encourage her</button><button data-memberresponse="pressure" data-id="${id}">Demand more effort</button><button data-memberresponse="listen" data-id="${id}">Ask how she feels</button></div>`);return}
if(a==='publish'){let text=$('#postText').value.trim();if(!text){notify('Write something before publishing.');return}let d=socialReaction(text);s.rep=clamp(s.rep+d);s.pop=clamp(s.pop+(d>0?rnd(1,3):d<0?rnd(-4,-1):0));s.fan=clamp(s.fan+(d>0?rnd(1,3):d<0?rnd(-3,0):0));s.posts++;post(s.player.name,'@hanmirae_official',text,'player',{mine:true,likes:rnd(1,100)});log('Mirae published a social media post. Public response '+(d>0?'was positive.':d<0?'was negative.':'was mixed.'));notify(d>0?'Positive response! Reputation improved.':d<0?'Backlash! Reputation took a hit.':'Your post received a mixed response.');}
if(a==='like'){p=s.feed.find(x=>x.id===id);if(p){p.likes++;notify('You liked the post.')} }
if(a==='randomLook'){const A=s.player.appearance;const sets={face:['soft','oval','heart','round','sharp'],eyes:['almond','doe','cat','sleepy','upturned','round'],hairStyle:['long','wavy','bob','hime','ponytail','twin tails','braid','layered','updo'],bangs:['curtain','straight','wispy','side swept','none'],outfitStyle:['practice','casual','preppy','streetwear','stage','elegant','airport','school'],accessory:['none','earrings','hair clips','ribbon','headband','choker','glasses','headset','tiara']};Object.entries(sets).forEach(([k,v])=>A[k]=pick(v));['skin','hair','hair2','iris','lip','makeup','outfit','trim'].forEach(k=>A[k]='#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0'));persist();render();notify('A new look has been created.');return}
if(a==='resetLook'){s.player.appearance={skin:'#a96f55',hair:'#211a25',hair2:'#5b405f',iris:'#8b735d',lip:'#bd718a',makeup:'#b76a86',outfit:'#59416f',trim:'#e58bbd',face:'soft',eyes:'almond',hairStyle:'long',bangs:'curtain',expression:'gentle',makeupStyle:'soft',outfitStyle:'stage',accessory:'none'};persist();render();notify('Mirae’s look has been reset.');return}
if(a==='savePlayer'){s.player.name=$('#pName').value.trim()||'Han Mirae';s.player.stageName=$('#pStage')?$('#pStage').value.trim():'Mirae';s.player.bio=$('#pBio').value;log('Mirae updated her appearance and public profile.');persist();notify('Mirae’s character profile saved.');render();return}
if(a==='saveMembers'){s.members.forEach(p=>{let st=$(`[data-stage="${p.id}"]`),po=$(`[data-position="${p.id}"]`);if(st)p.stageName=st.value.trim();if(po&&po.value){p.positions=[po.value,...p.positions.filter(x=>x!==po.value)]}});notify('Member profiles updated.')}
if(a==='export'){let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='IDOLVERSE-save.json';a.click();URL.revokeObjectURL(u);notify('Save backup exported.');return}
if(a==='saveNow'){persist();notify('Game saved in this browser.')}
if(a==='import'){let f=window.__idolverseImportFile;if(!f){notify('Choose a JSON save file first.');return}let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!data.player||!Array.isArray(data.members)||!Array.isArray(data.pool))throw Error('Invalid save');s=data;persist();page='dashboard';render();notify('Save imported successfully.')}catch(e){notify('That file is not a valid IDOLVERSE save.')}};reader.readAsText(f);return}
if(a==='reset'){if(confirm('Delete current save and start a new game?')){s=initial();page='dashboard';log('A new save was created.');notify('New game started.')}}
render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}});
$('#content').addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-page],[data-response],[data-memberresponse]');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();return}if(b.dataset.response){let p=s.staff[+b.dataset.id],r=b.dataset.response,delta=r==='support'?rnd(4,8):r==='dismiss'?rnd(-9,-4):rnd(-3,3);p.opinion=clamp(p.opinion+delta);log('Mirae '+({support:'showed support to ',dismiss:'dismissed ',challenge:'challenged '}[r])+p.name+'. Staff opinion changed.');$('#modalbg').classList.remove('open');notify('Conversation outcome recorded.');render();return}if(b.dataset.memberresponse){let p=s.members.find(x=>x.id===b.dataset.id),r=b.dataset.memberresponse;if(p){let d=r==='encourage'?rnd(5,10):r==='pressure'?rnd(-9,-3):rnd(3,8);p.morale=clamp(p.morale+d);p.trust=clamp(p.trust+(r==='listen'?8:r==='pressure'?-5:4));p.stress=clamp(p.stress+(r==='pressure'?10:-4));log('Mirae spoke privately with '+p.name+'.');}$('#modalbg').classList.remove('open');render();return}act(b.dataset.act,b.dataset.id)});
$('#content').addEventListener('input',e=>{if(e.target.id==='postText'){$('#charCount').textContent=e.target.value.length+' / 280'}});
$('#content').addEventListener('click',e=>{const t=e.target.closest('[data-studiotab]');if(t){studioTab=t.dataset.studiotab;render();return}const o=e.target.closest('[data-look]');if(o){s.player.appearance=s.player.appearance||{};s.player.appearance[o.dataset.look]=o.dataset.value;persist();render();return}});
$('#content').addEventListener('input',e=>{const c=e.target.closest('[data-color]');if(c){s.player.appearance=s.player.appearance||{};s.player.appearance[c.dataset.color]=c.value;const code=c.parentElement.querySelector('code');if(code)code.textContent=c.value;const stage=$('.studio-stage');if(stage)stage.innerHTML=animePortrait(s.player.appearance)+`<div class="studio-name">${esc(s.player.name)}</div><div class="studio-sub">PLAYER CHARACTER · ECLIPSE ENTERTAINMENT</div>`;persist()}});
$('#advance').addEventListener('click',advance);
$('#modalbg').addEventListener('click',e=>{if(e.target.id==='modalbg')$('#modalbg').classList.remove('open')});
$('#content').addEventListener('change',e=>{if(e.target.id==='importFile'){window.__idolverseImportFile=e.target.files&&e.target.files[0]||null}});
$('#content').addEventListener('click',e=>{let b=e.target.closest('[data-act="feedAll"],[data-act="feedIdols"],[data-act="feedNews"]');if(!b)return;let mode=b.dataset.act;let items=mode==='feedIdols'?s.feed.filter(x=>x.kind==='idol'):mode==='feedNews'?s.feed.filter(x=>x.kind==='official'):s.feed;let holder=$('#content');let posts=holder.querySelectorAll('.feedpost');let list=holder.querySelector('.split > div');if(list){let area=list.querySelectorAll('.feedpost');area.forEach(x=>x.remove());let anchor=list.querySelector('textarea');let cursor=anchor&&anchor.parentElement;let target=cursor?cursor.parentElement:list;items.forEach(x=>target.insertAdjacentHTML('beforeend',postHTML(x)));}});
let saved=null;try{saved=JSON.parse(localStorage.getItem('idolverse_autosave')||'null')}catch(e){}if(saved&&saved.version===2){s=saved;s.player.appearance=s.player.appearance||{skin:'#a96f55',hair:'#211a25',hair2:'#5b405f',iris:'#8b735d',lip:'#bd718a',makeup:'#b76a86',outfit:'#59416f',trim:'#e58bbd',face:'soft',eyes:'almond',hairStyle:'long',bangs:'curtain',expression:'gentle',makeupStyle:'soft',outfitStyle:'stage',accessory:'none'};}else{post('IDOLWIRE NEWS','@idolwire_news','The 2026 rookie race is heating up. Which agency will surprise everyone this year?','official');post('CHERRYBOMB','@cherrybomb_official','Practice room diaries soon. Who wants to see?','idol')}
render();
})();
</script>
