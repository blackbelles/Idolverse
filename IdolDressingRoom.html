<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idol Dressing Room</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff3;--panel:#fbfbfd;--ink:#232029;--mut:#6b7080;--line:#d3d8e0;--acc:#a8556d;--acc2:#8fb0b8;--stage1:#b8c4cd;--stage2:#5f6f82;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151b;--panel:#1c2029;--ink:#eef0f4;--mut:#9aa1b2;--line:#323846;--stage1:#3f4d5e;--stage2:#1b2330;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151b;--panel:#1c2029;--ink:#eef0f4;--mut:#9aa1b2;--line:#323846;--stage1:#3f4d5e;--stage2:#1b2330;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN',system-ui,sans-serif;font-weight:500}
.app{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:20px;max-width:1100px;margin:0 auto;padding:16px}
.stage{position:sticky;top:16px;align-self:start;border-radius:28px;background:radial-gradient(circle at 50% 30%,#fff8 0,#fff0 55%),linear-gradient(160deg,var(--stage1),var(--stage2));padding:12px;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line)}
.stage svg{width:100%;height:calc(100vh - 150px);max-height:640px;display:block}
.stage h1{margin:4px 8px 0;font-size:20px;font-weight:900}
.btns{display:flex;gap:8px;flex-wrap:wrap;padding:8px}
button{font:inherit;color:var(--ink);cursor:pointer}
.btn{border:2px solid var(--ink);background:var(--panel);border-radius:999px;padding:6px 14px;font-weight:700}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.side{min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.tab{flex:none;border:0;background:var(--panel);border-radius:14px 14px 4px 4px;padding:10px 16px;font-weight:700;color:var(--mut)}
.tab[aria-selected=true]{background:var(--acc);color:#fff}
.sec{background:var(--panel);border-radius:20px;padding:14px;margin-bottom:12px;border:2px solid var(--line)}
.sec h2{margin:0 0 10px;font-size:16px;font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:2px solid var(--line);background:transparent;border-radius:12px;padding:6px 12px}
.chip[aria-pressed=true]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,transparent);font-weight:900}
.cp{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.wheelbox{position:relative;width:132px;height:132px;flex:none;touch-action:none}
.wheelbox canvas{width:132px;height:132px;border-radius:50%;display:block;cursor:crosshair}
.dot{position:absolute;width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #000a;transform:translate(-50%,-50%);pointer-events:none}
.ctl{display:flex;flex-direction:column;gap:8px;min-width:150px;flex:1}
.ctl label{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px}
.ctl input[type=range]{flex:1;accent-color:var(--acc)}
.hex{width:92px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:5px 8px;font:inherit}
.sw{display:flex;gap:5px;flex-wrap:wrap}
.sw button{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
dialog{border:3px solid var(--acc);border-radius:20px;background:var(--panel);color:var(--ink);max-width:460px;width:92vw}
dialog textarea{width:100%;height:160px;background:transparent;color:var(--ink);border:2px solid var(--line);border-radius:10px;font:12px monospace}
@media(max-width:780px){.app{grid-template-columns:1fr;padding:10px}.stage{top:calc(env(safe-area-inset-top,0px) + 4px);z-index:5}.stage svg{height:40vh}.stage h1{display:none}}
.ch *{transform-box:view-box}
.ch .bl{transform-box:fill-box;transform-origin:50% 50%;animation:bl 5s linear infinite}
.ch .br{transform-origin:150px 420px;animation:br 4.2s ease-in-out infinite}
.ch .hd{animation:hd 4.2s ease-in-out infinite}
.ch .fr{transform-origin:150px 240px;animation:fr 7s ease-in-out infinite}
.ch .hs{transform-origin:150px 90px;animation:hs 5.5s ease-in-out infinite}
.ch .pt{animation:pt 9s linear infinite;opacity:0}
.ch .bl,.ch .br,.ch .hd,.ch .fr,.ch .hs{animation-delay:calc(var(--t)*-1s)}
@keyframes bl{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.06)}}
@keyframes br{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.014)}}
@keyframes hd{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes fr{0%,100%{transform:rotate(-.9deg)}50%{transform:rotate(.9deg)}}
@keyframes hs{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes pt{0%{transform:translate(0,-30px);opacity:0}15%{opacity:.8}100%{transform:translate(-40px,90px);opacity:0}}
@media(prefers-reduced-motion:reduce){.ch *{animation:none!important}}
.ch .sw{transform-origin:108px 258px;animation:sw 3.5s ease-in-out infinite}
.ch .bg{transform-origin:150px 60px}
.ch.wind .hs{animation:hsw 2.2s ease-in-out infinite}
.ch.wind .bg{animation:bgw 1.9s ease-in-out infinite}
.ch.wind .sw{animation:sww 1.6s ease-in-out infinite}
.ch.wind .pt{animation-name:ptw;animation-duration:4s}
.ch .sw,.ch .bg,.ch.wind *{animation-delay:calc(var(--t)*-1s)}
@keyframes sw{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
@keyframes sww{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(12deg)}}
@keyframes hsw{0%,100%{transform:rotate(2deg) skewX(-3deg)}50%{transform:rotate(8deg) skewX(4deg)}}
@keyframes bgw{0%,100%{transform:rotate(0) skewX(0)}50%{transform:rotate(1.5deg) skewX(5deg)}}
@keyframes ptw{0%{transform:translate(60px,-10px);opacity:0}15%{opacity:.9}100%{transform:translate(-200px,40px);opacity:0}}
</style></head>
<body>
<div class="app">
<div class="stage"><h1>Idol Dressing Room</h1><div id="view"></div>
<div class="btns"><button class="btn p" id="rnd">Randomize</button><button class="btn" id="rst">Reset</button><button class="btn" id="dat">Save / Load</button><button class="btn" id="wnd">Wind: Off</button><button class="btn" id="frm">Framing: Portrait</button></div></div>
<div class="side"><div class="tabs" role="tablist" id="tabs"></div><div id="panel"></div></div>
</div>
<dialog id="dlg"><p style="margin-top:0"><b>Character data.</b> Copy this to save your idol, or paste a saved one and load it.</p><textarea id="ta" spellcheck="false"></textarea><div class="btns"><button class="btn p" id="load">Load</button><button class="btn" id="cls">Close</button></div></dialog>
<script>
const DEF={expr:'neutral',face:'oval',skin:'#eadbd5',mouth:'smile',eyes:'sleepy',iris:'#a8956a',brow:'worried',browC:'#2a201f',hair:'long',bangs:'curtain',hairC:'#221c1a',tipC:'#1a1514',shadow:'soft',shadowC:'#a8808a',blush:'hatch',blushC:'#e58fa0',lip:'matte',lipC:'#c98f98',top:'sailor',topC:'#d9dde3',accC:'#4a4a3a',bottom:'pleated',botC:'#3a3f55',shoes:'boots',shoeC:'#2a2528',acc:'none',accessC:'#8fb0b8'};
const O=a=>a.map(x=>[x,x[0].toUpperCase()+x.slice(1)]);
const TABS={Face:[{t:'Face shape',s:'face',o:['oval','round','heart','square','long','diamond','soft','petite','wide','pointed']},{t:'Skin tone',c:'skin',p:['#f3e6e0','#eadbd5','#e3c4b0','#cfa586','#a37656','#6e4a38']},{t:'Expression',s:'expr',o:['neutral','happy','sad','shy','angry','surprised','smug','wink','sleepy','pout']},{t:'Mouth',s:'mouth',o:['smile','open','cat','tiny','frown','smirk','pout','grin','gasp','flat']}],
Eyes:[{t:'Eye shape',s:'eyes',o:['round','sharp','sleepy','wide','cat','droopy','narrow','doe','big','tired','upturned','small','gentle']},{t:'Eye color',c:'iris'},{t:'Eyebrows',s:'brow',o:['soft','straight','angled','worried','arched','thin','bushy','flat','short','angry','raised']},{t:'Brow color',c:'browC'}],
Hair:[{t:'Hairstyle',s:'hair',o:['long','wavy','bob','lob','pixie','twin','pony','sidepony','buns','topknot','braid','curly','shag']},{t:'Bangs',s:'bangs',o:['straight','side','sideR','curtain','center','wispy','full','micro','asym','swoop','none']},{t:'Hair color',c:'hairC'},{t:'Tip color (ombré)',c:'tipC'}],
Makeup:[{t:'Eyeshadow',s:'shadow',o:['none','soft','winged','glitter','smoky','gems'],c:'shadowC'},{t:'Blush',s:'blush',o:['none','soft','hatch','sweep','nose','freckles','heavy','stars'],c:'blushC'},{t:'Lips',s:'lip',o:['none','matte','gloss'],c:'lipC'}],
Outfit:[{t:'Top',s:'top',o:['tee','tank','crop','sailor','strapless','jacket','hoodie','turtleneck','blouse','kimono','cardigan'],c:'topC'},{t:'Trim and accents',c:'accC'},{t:'Bottom',s:'bottom',o:['skirt','mini','long','pleated','pleatmini','flared','hotpants','shorts','bermuda','capri','pants','leggings'],c:'botC'},{t:'Shoes',s:'shoes',o:['none','sneakers','flats','loafers','heels','platforms','ankle','boots','knee','thigh','sandals','socks'],c:'shoeC'}],
Accessory:[{t:'Accessory',s:'acc',o:['none','ribbon','cat ears','bunny ears','star clips','headset','headband','halo','tiara','beret','glasses','flower','choker','hairclips'],c:'accessC'}]};
const PAL=['#221c1a','#5a3a30','#b89b7a','#d9c9b0','#8a98a8','#4a5a6a','#6b4a52','#c4788f','#e6e9ee','#2b2c35'];
let S={...DEF},tab='Face';
try{const v=JSON.parse(localStorage.getItem('idol3')||'null');if(v)S={...DEF,...v}}catch(e){}
const save=()=>{try{localStorage.setItem('idol2',JSON.stringify(S))}catch(e){}};
// ---------- color helpers
function hsv2hex(h,s,v){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return'#'+[f(5),f(3),f(1)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
function hex2hsv(x){const r=parseInt(x.slice(1,3),16)/255,g=parseInt(x.slice(3,5),16)/255,b=parseInt(x.slice(5,7),16)/255,m=Math.max(r,g,b),d=m-Math.min(r,g,b);let h=0;if(d){h=m==r?((g-b)/d+6)%6:m==g?(b-r)/d+2:(r-g)/d+4}return[h*60,m?d/m:0,m]}
function shade(x,a){const n=[1,3,5].map(i=>Math.max(0,Math.min(255,Math.round(parseInt(x.slice(i,i+2),16)*(1+a)))));return'#'+n.map(v=>v.toString(16).padStart(2,'0')).join('')}
// ---------- wheel
function wheel(key,pal){
 const box=document.createElement('div');box.className='cp';
 box.innerHTML=`<div class="wheelbox"><canvas width="132" height="132" aria-label="Color wheel"></canvas><div class="dot"></div></div><div class="ctl"><label>Brightness<input type="range" min="0" max="100"></label><label><span class="chipc" style="width:22px;height:22px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line)"></span><input class="hex" maxlength="7" aria-label="Hex color"></label><div class="sw"></div></div>`;
 const cv=box.querySelector('canvas'),ctx=cv.getContext('2d'),dot=box.querySelector('.dot'),rg=box.querySelector('input[type=range]'),hx=box.querySelector('.hex'),chip=box.querySelector('.chipc'),sw=box.querySelector('.sw');
 let [h,s,v]=hex2hsv(S[key]);
 const draw=()=>{const im=ctx.createImageData(132,132);for(let y=0;y<132;y++)for(let x=0;x<132;x++){const dx=x-66,dy=y-66,r=Math.hypot(dx,dy)/66;if(r>1)continue;const c=hsv2hex((Math.atan2(dy,dx)*180/Math.PI+360)%360,r,v),i=(y*132+x)*4;im.data[i]=parseInt(c.slice(1,3),16);im.data[i+1]=parseInt(c.slice(3,5),16);im.data[i+2]=parseInt(c.slice(5,7),16);im.data[i+3]=255}ctx.putImageData(im,0,0)};
 const ui=()=>{const a=h*Math.PI/180;dot.style.left=66+Math.cos(a)*s*66+'px';dot.style.top=66+Math.sin(a)*s*66+'px';rg.value=v*100;hx.value=S[key];chip.style.background=S[key]};
 const set=c=>{S[key]=c;ui();render();save()};
 const pick=e=>{const r=cv.getBoundingClientRect(),dx=(e.clientX-r.left)/r.width*132-66,dy=(e.clientY-r.top)/r.height*132-66;h=(Math.atan2(dy,dx)*180/Math.PI+360)%360;s=Math.min(1,Math.hypot(dx,dy)/66);set(hsv2hex(h,s,v))};
 let down=false;cv.onpointerdown=e=>{down=true;cv.setPointerCapture(e.pointerId);pick(e)};cv.onpointermove=e=>down&&pick(e);cv.onpointerup=()=>down=false;
 rg.oninput=()=>{v=rg.value/100;draw();set(hsv2hex(h,s,v))};
 hx.onchange=()=>{let t=hx.value.trim();if(/^#[0-9a-f]{6}$/i.test(t)){[h,s,v]=hex2hsv(t.toLowerCase());draw();set(t.toLowerCase())}else hx.value=S[key]};
 (pal||PAL).forEach(c=>{const b=document.createElement('button');b.style.background=c;b.title=c;b.onclick=()=>{[h,s,v]=hex2hsv(c);draw();set(c)};sw.appendChild(b)});
 draw();ui();return box}
// ---------- panel
function buildTabs(){const t=document.getElementById('tabs');t.innerHTML='';Object.keys(TABS).forEach(k=>{const b=document.createElement('button');b.className='tab';b.role='tab';b.textContent=k;b.setAttribute('aria-selected',k==tab);b.onclick=()=>{tab=k;buildTabs();buildPanel()};t.appendChild(b)})}
function buildPanel(){const p=document.getElementById('panel');p.innerHTML='';TABS[tab].forEach(d=>{const sec=document.createElement('section');sec.className='sec';sec.innerHTML=`<h2>${d.t}</h2>`;
 if(d.s){const ch=document.createElement('div');ch.className='chips';d.o.forEach(o=>{const b=document.createElement('button');b.className='chip';b.textContent=o[0].toUpperCase()+o.slice(1);b.setAttribute('aria-pressed',S[d.s]==o);b.onclick=()=>{S[d.s]=o;ch.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x==b));render();save()};ch.appendChild(b)});sec.appendChild(ch)}
 if(d.c)sec.appendChild(wheel(d.c,d.p));p.appendChild(sec)})}
// ---------- character art
const OL='#1a1416',dk=(c,a=-.3)=>shade(c,a),hst=`stroke="${OL}" stroke-width="1.6" stroke-linejoin="round"`,mir=g=>g+`<g transform="translate(300 0) scale(-1 1)">${g}</g>`;
let FULL=false,WIND=false;const T0=performance.now();
const star=(x,y,r,f)=>{let p='';for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,q=i%2?r*.45:r;p+=(i?'L':'M')+(x+Math.cos(a)*q).toFixed(1)+' '+(y+Math.sin(a)*q).toFixed(1)}return`<path d="${p}Z" fill="${f}" stroke="${OL}" stroke-width="1.2"/>`};
const FS={oval:[54,30,226],round:[56,50,220],heart:[54,18,232],square:[54,54,214],long:[48,26,238],diamond:[48,16,230],soft:[56,40,224],petite:[48,30,216],wide:[58,40,218],pointed:[52,10,236]};
const facePath=k=>{const[w,j,y]=FS[k],L=150-w,R=150+w,m=(136+y)/2+8;return`M${L} 136C${L} 98 118 86 150 86C182 86 ${R} 98 ${R} 136C${R} ${m} ${150+j} ${y-14} 150 ${y}C${150-j} ${y-14} ${L} ${m} ${L} 136Z`};
const EXP={neutral:{},happy:{m:'grin',b:'soft',c:'up'},sad:{m:'frown',b:'worried',lid:.3},shy:{m:'tiny',b:'worried',bl:1,lid:.15},angry:{m:'frown',b:'angry',lid:.2},surprised:{m:'gasp',b:'raised',big:1},smug:{m:'smirk',b:'angled',lid:.35},wink:{m:'smile',c:'r'},sleepy:{m:'tiny',lid:.55},pout:{m:'pout',b:'soft'}};
const P=(d,f)=>`<path d="${d}" fill="${f}" ${hst}/>`,cap=c=>`<ellipse cx="150" cy="125" rx="74" ry="72" fill="${c}"/>`;
const HB={long:f=>P('M76 130C70 60 230 60 224 130L236 360C236 390 200 395 190 375L190 226L110 226L110 375C100 395 64 390 64 360Z',f),
wavy:f=>P('M76 130C70 60 230 60 224 130C246 190 214 230 238 290C256 340 226 360 232 400C200 410 190 380 190 340L190 226L110 226L110 340C110 380 100 410 68 400C74 360 44 340 62 290C86 230 54 190 76 130Z',f),
bob:f=>P('M72 146C68 62 232 62 228 146L232 236C232 250 200 250 196 234L104 234C100 250 68 250 68 236Z',f),
lob:f=>P('M72 146C68 62 232 62 228 146L234 300C234 316 200 316 196 298L104 298C100 316 66 316 66 300Z',f),
pixie:f=>P('M80 140C72 60 228 60 220 140L214 164L86 164Z',f),
twin:(f,c)=>cap(c)+mir(P('M92 100C40 110 36 200 50 250C56 300 40 330 60 350C80 335 78 290 84 250C96 200 104 150 100 110Z',f)),
pony:(f,c)=>P('M190 66C256 50 280 130 256 210C244 270 276 310 238 352C230 306 214 262 204 206C198 160 190 110 190 66Z',f)+cap(c),
sidepony:(f,c)=>P('M200 110C250 120 262 200 244 270C240 300 252 330 232 350C222 310 214 270 208 220C204 180 200 140 200 110Z',f)+cap(c),
buns:(f,c)=>mir(`<circle cx="98" cy="64" r="28" fill="${c}" ${hst}/>`)+P('M74 146C72 70 228 70 226 146L228 220C226 230 202 230 198 218L102 218C98 230 74 230 72 220Z',f),
topknot:(f,c)=>`<circle cx="150" cy="44" r="26" fill="${c}" ${hst}/>`+cap(c)+P('M76 130C72 70 228 70 224 130L226 190L74 190Z',f),
braid:(f,c)=>cap(c)+Array.from({length:8},(_,i)=>`<ellipse cx="${236-i%2*4}" cy="${216+i*28}" rx="13" ry="17" fill="${i%2?dk(S.tipC,.1):f}" ${hst}/>`).join('')+P('M76 130C70 60 230 60 224 130L226 220L74 220Z',f),
curly:(f,c)=>Array.from({length:12},(_,i)=>{const a=i*Math.PI/6;return`<circle cx="${150+Math.cos(a)*78}" cy="${120+Math.sin(a)*64+(Math.sin(a)>0?30:0)}" r="30" fill="${c}" ${hst}/>`}).join('')+cap(c),
shag:f=>P('M70 150C64 56 236 56 230 150L246 250C250 280 214 270 206 240L94 240C86 270 50 280 54 250Z',f)};
const LKY={long:332,wavy:332,shag:262,lob:296,bob:232,twin:262,pony:250,sidepony:250,buns:232,topknot:250,braid:332,curly:220};
const hairBack=()=>HB[S.hair]('url(#hg)',S.hairC);
const BG='M88 150C82 78 112 52 150 52C188 52 218 78 212 150';
const BD={straight:'C206 128 198 114 188 112L176 128L164 112L150 130L136 112L124 128L112 112C102 114 94 128 88 150Z',side:'C206 120 188 104 166 104C138 110 112 126 96 160C92 158 90 154 88 150Z',sideR:'',curtain:'C204 130 176 118 150 98C124 118 96 130 88 150Z',center:'C202 132 170 128 150 90C130 128 98 132 88 150Z',wispy:'C208 130 200 120 192 126L184 112L174 130L166 110L156 132L148 108L138 130L128 112L120 128L110 114C100 120 94 132 88 150Z',full:'C206 140 196 132 150 136C104 132 94 140 88 150Z',micro:'C200 112 180 100 150 100C120 100 100 112 88 150Z',asym:'C210 120 192 106 170 108C140 112 120 132 100 176C94 170 90 160 88 150Z',swoop:'C210 126 196 104 170 96C150 108 130 124 88 150Z',none:'C200 110 180 96 150 94C120 96 100 110 88 150Z'};
function bangs(){const c=S.hairC,y=LKY[S.hair],R=S.bangs=='sideR',d=BG+(R?BD.side:BD[S.bangs]),h=k=>120+(y-120)*k;
 const lk=y?mir(P(`M90 120C80 ${h(.6)} 96 ${h(.85)} 86 ${y}C106 ${y-50} 114 ${(y+140)/2-20} 108 140Z`,c)):'';
 return`<g class="bg">${lk}${R?`<g transform="translate(300 0) scale(-1 1)">${P(d,c)}</g>`:P(d,c)}</g>`}
const EK={round:[12,14,9.5,12,0],sharp:[14,10,8.5,10,0,1],sleepy:[12.5,12,9.5,11,.42],wide:[13,17,11,14.5,0],cat:[15,9,8.5,9,0,1],droopy:[13,13,10,12,.25],narrow:[13,9,8,8,0],doe:[13,15,11.5,13.5,0],big:[14,18,12,16,0],tired:[12.5,12,9.5,11,.55],upturned:[14,11,9,10,0,1],small:[10,10,8,9,0],gentle:[12,13,9.5,12,.15]};
function eye(cx,m,e){const y=154,I=S.iris,sk=S.skin,id='c'+(m>0?'l':'r');let[rx,ry,ia,ib,lid,sh]=EK[S.eyes];if(e.big)[rx,ry,ia,ib,lid,sh]=EK.wide;if(e.lid){lid=Math.max(lid,e.lid);sh=0}
 if(e.c=='up'||(e.c=='r'&&m<0))return`<path d="M${cx-rx} ${y+3}Q${cx} ${y-9} ${cx+rx} ${y+3}" stroke="${OL}" stroke-width="3.4" fill="none" stroke-linecap="round"/><path d="M${cx-m*rx} ${y+2}l${-m*5} -5" stroke="${OL}" stroke-width="2.4" stroke-linecap="round"/>`;
